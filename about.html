    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        html, body { margin: 0; padding: 0; min-height: 100%; }

        body {
            background: #1a0f14 url("about-bg.jpg") center center / cover no-repeat fixed;
            color: #000;
            font-family: Georgia, "Times New Roman", serif;
        }

        .top-menu {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 42px;
            background: #885069;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0,0,0,.18);
        }
        .top-menu a {
            color: #050505;
            text-decoration: none;
            font-size: 21px;
            font-weight: bold;
        }
        .top-menu a:hover { text-decoration: underline; }
        .top-menu .star {
            color: #111;
            font-size: 18px;
            opacity: 0.75;
            margin-left: 6px;
            cursor: pointer;
            user-select: none;
        }
        .top-menu .star:hover { opacity: 1; }

        .about-page {
            min-height: 100vh;
            padding: 100px 20px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .about-title {
            max-width: 900px;
            width: 100%;
            margin: 0 0 20px;
            color: #000;
            font-family: "Bodoni 72", Didot, "Bodoni MT", Georgia, serif;
            font-size: clamp(70px, 11vw, 150px);
            font-weight: 400;
            line-height: .8;
            letter-spacing: -5px;
            text-shadow: 0 2px 0 rgba(255,255,255,.35), 0 8px 24px rgba(0,0,0,.25);
        }

        .about-subtitle {
            max-width: 900px;
            width: 100%;
            margin: 0 0 40px;
            font-size: 17px;
            font-style: italic;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,.2);
        }

        .about-card {
            max-width: 900px;
            width: 100%;
            position: relative;
            padding: 36px 32px;
            border-radius: 22px;
            background: linear-gradient(
                180deg,
                rgba(255,255,255,.18) 0%,
                rgba(255,255,255,.06) 100%
            );
            border: 1px solid rgba(255,255,255,.35);
            box-shadow: 0 16px 40px rgba(0,0,0,.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .about-card > * { position: relative; z-index: 2; }

        .about-text {
            margin: 0;
            font-size: 22px;
            line-height: 1.6;
            font-style: italic;
        }
        .about-text p {
            margin: 0 0 12px;
        }
        .about-text p:last-child {
            margin-bottom: 0;
        }

        footer {
            min-height: 110px;
            background: #000;
            color: #F1B9D0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 28px;
          }
        .socials {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }
        .socials a {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F1B9D0;
            text-decoration: none;
        }
        .socials a:hover { opacity: 0.8; transform: scale(1.08); }
        .socials svg { width: 22px; height: 22px; fill: currentColor; }

        .back-to-top-fixed {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #885069;
            color: #f6dce8;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
        }
        .back-to-top-fixed:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        @media (max-width: 700px) {
            .top-menu {
                padding: 0 8px;
                gap: 11px;
                justify-content: flex-start;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .top-menu::-webkit-scrollbar { display: none; }
            .top-menu a { font-size: 16px; }
            .about-page { padding: 85px 12px 50px; }
            .about-title { font-size: clamp(55px, 17vw, 100px); letter-spacing: -4px; }
            .about-card { padding: 24px 20px; border-radius: 16px; }
            .about-text { font-size: 18px; }
            footer { grid-template-columns: 1fr; gap: 18px; text-align: center; }
            .back-to-top-fixed { right: 16px; bottom: 16px; width: 40px; height: 40px; }
        }
    </style>
</head>

    <script>
    (function () {
        var star = document.getElementById("admin-star");
        if (!star) return;
        var clicks = 0;
        var timer = null;
        star.onclick = function () {
            clicks = clicks + 1;
            if (timer) clearTimeout(timer);
            timer = setTimeout(function () { clicks = 0; }, 2000);
            if (clicks >= 3) {
                clicks = 0;
                window.location.href = "admin.html";
            }
        };
    })();
