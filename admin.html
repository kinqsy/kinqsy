<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — feedback</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
body { margin:0; font-family: Georgia, serif; background:#1a0f14; color:#f6dce8; min-height:100vh; padding:40px 20px; }
.box { max-width:720px; margin:0 auto; padding:24px; border-radius:20px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); }
h1 { font-weight:normal; margin-top:0; }
li { margin:12px 0; padding:12px; border-radius:12px; background:rgba(0,0,0,.2); }
a { color:#f0c9d6; }
.empty { opacity:.7; font-style:italic; }
</style>
</head>
<body>
<div class="box">
  <h1>жалобы и предложения</h1>
  <p>Публикация постов отсюда отключена. Посты — через ★ на notes / dreams / quotes.</p>
  <p><a href="index.html">← на сайт</a></p>
  <ul id="list" class="empty">загрузка…</ul>
</div>
<script>
(function () {
  var list = document.getElementById("list");
  try {
    var arr = JSON.parse(localStorage.getItem("kinqsy_suggestions") || "[]");
    if (!arr.length) {
      list.textContent = "пока пусто (предложения с home → цитата попадают сюда на этом устройстве)";
      return;
    }
    list.className = "";
    list.innerHTML = arr.slice().reverse().map(function (x) {
      return "<li><strong>" + (x.type || "item") + "</strong> · " + (x.at || "") +
        "<br>" + (x.text || "") + (x.author ? "<br>— " + x.author : "") + "</li>";
    }).join("");
  } catch (e) {
    list.textContent = "ошибка чтения";
  }
})();
</script>
</body>
</html>
