<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINQSY.LOL — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    background: #F5BACB;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
    padding: 70px 20px;
}
.admin {
    width: min(650px, 100%);
    margin: auto;
    padding: 35px;
    background: rgba(255,255,255,.45);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}
h1 { margin-top: 0; font-size: 48px; letter-spacing: -3px; }
input, textarea, select {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 1px solid rgba(0,0,0,.15);
    border-radius: 12px;
    background: rgba(255,255,255,.7);
    font-family: Georgia, serif;
    font-size: 16px;
}
textarea { min-height: 200px; resize: vertical; }
label { display: block; margin-top: 18px; font-weight: bold; }
.hint { margin-top: 6px; font-size: 13px; opacity: 0.7; font-weight: normal; }
button {
    margin-top: 22px;
    margin-right: 10px;
    padding: 13px 28px;
    border: 0;
    border-radius: 999px;
    background: #885069;
    color: white;
    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
button.secondary { background: #333; }
button:hover { opacity: .85; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
#status { margin-top: 18px; font-weight: bold; min-height: 24px; }
#login-box { display: block; }
#admin-box { display: none; }
#preview {
    margin-top: 12px;
    display: none;
    max-width: 100%;
    border-radius: 14px;
}
</style>
</head>
<body>
<div class="admin">
    <h1>admin</h1>

    <div id="login-box">
        <label>email</label>
        <input id="email" type="email" autocomplete="email">
        <label>password</label>
        <input id="password" type="password" autocomplete="current-password">
        <button id="login-button">login</button>
    </div>

    <div id="admin-box">
        <p>logged in ✓</p>

        <label>publish to</label>
        <select id="category">
            <option value="notes">notes</option>
            <option value="dreams">dreams</option>
            <option value="quotes">quotation / definition</option>
        </select>

        <label>title</label>
        <input id="title" type="text" maxlength="200">

        <label>text</label>
        <textarea id="content" maxlength="10000"></textarea>

        <label>image / gif url</label>
        <input id="media_url" type="url" placeholder="https://...">
        <div class="hint">Прямая ссылка на картинку или GIF.</div>
        <img id="preview" alt="preview">

        <button id="publish-button">publish</button>
        <button id="logout-button" class="secondary">logout</button>
    </div>

    <div id="status"></div>
</div>

<script>
const SUPABASE_URL = "https://rgkfegdtxaojceknnzlr.supabase.co";
const SUPABASE_KEY = "sb_publishable_uK7zrVyq8AlHpoj13pGQ6g_q3L47Akw";
const OWNER_UID = "4923abc5-5c86-48c2-904b-a267c2e21703";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function guessMediaType(url) {
    if (!url) return null;
    const u = url.toLowerCase();
    if (u.indexOf(".gif") !== -1) return "gif";
    if (u.indexOf("giphy") !== -1) return "gif";
    if (u.indexOf("tenor") !== -1) return "gif";
    return "image";
}

document.getElementById("media_url").addEventListener("input", function () {
    const url = this.value.trim();
    const preview = document.getElementById("preview");
    if (url) {
        preview.src = url;
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
        preview.removeAttribute("src");
    }
});

async function checkSession() {
    const { data: { user }, error } = await supabaseClient.auth.getUser();

    if (error) {
        document.
            getElementById("status").textContent = "Auth error: " + error.message;
        return;
    }

    if (!user) {
        document.getElementById("login-box").style.display = "block";
        document.getElementById("admin-box").style.display = "none";
        return;
    }

    if (user.id !== OWNER_UID) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("admin-box").style.display = "none";
        document.getElementById("status").textContent = "Access denied. You are not the owner.";
        return;
    }

    document.getElementById("login-box").style.display = "none";
    document.getElementById("admin-box").style.display = "block";
    document.getElementById("status").textContent = "";
}

document.getElementById("login-button").addEventListener("click", async function () {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const status = document.getElementById("status");
    const btn = document.getElementById("login-button");

    if (!email || !password) {
        status.textContent = "Введите email и пароль";
        return;
    }

    status.textContent = "Вход...";
    btn.disabled = true;

    const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    btn.disabled = false;

    if (error) {
        status.textContent = "Ошибка: " + error.message;
        return;
    }

    status.textContent = "Успешно!";
    setTimeout(function () { location.reload(); }, 400);
});

document.getElementById("publish-button").addEventListener("click", async function () {
    const status = document.getElementById("status");
    const btn = document.getElementById("publish-button");
    const { data: { user } } = await supabaseClient.auth.getUser();

    if (!user || user.id !== OWNER_UID) {
        status.textContent = "Access denied.";
        return;
    }

    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();
    const category = document.getElementById("category").value;
    const media_url = document.getElementById("media_url").value.trim();

    if (!title && !content && !media_url) {
        status.textContent = "Добавь текст или картинку";
        return;
    }

    btn.disabled = true;
    status.textContent = "Публикую...";

    const payload = {
        title: title,
        content: content,
        category: category,
        user_id: user.id
    };

    if (media_url) {
        payload.media_url = media_url;
        payload.media_type = guessMediaType(media_url);
    }

    const { error } = await supabaseClient.from("posts").insert(payload);

    btn.disabled = false;

    if (error) {
        status.textContent = "Ошибка: " + error.message;
        return;
    }

    status.textContent = "Published to " + category + " ✓";
    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    document.getElementById("media_url").value = "";
    document.getElementById("preview").style.display = "none";
});

document.getElementById("logout-button").addEventListener("click", async function () {
    await supabaseClient.auth.signOut();
    location.reload();
});

checkSession();
</script>
</body>
</html>
