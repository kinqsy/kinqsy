<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KINQSY.LOL — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #F5BACB;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
    padding: 80px 20px;
}

.admin {
    max-width: 700px;
    margin: auto;
    padding: 35px;
    border-radius: 24px;

    background: rgba(255,255,255,.42);

    border: 1px solid rgba(255,255,255,.8);

    box-shadow:
        0 20px 50px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.9);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

h1 {
    margin-top: 0;
    font-size: 48px;
    letter-spacing: -3px;
}

label {
    display: block;
    margin: 20px 0 7px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 14px;

    border: 1px solid rgba(0,0,0,.15);
    border-radius: 12px;

    background: rgba(255,255,255,.65);

    font-family: Georgia, serif;
    font-size: 16px;
}

textarea {
    min-height: 220px;
}

button {
    margin-top: 22px;
    padding: 13px 28px;

    border: 0;
    border-radius: 999px;

    background: #885069;
    color: white;

    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

#status {
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="admin">

<h1>admin</h1>

<form id="post-form">

<label>title</label>

<input
    id="title"
    type="text"
    maxlength="200"
    required
>

<label>note</label>

<textarea
    id="content"
    maxlength="10000"
    required
></textarea>

<button type="submit">
publish
</button>

<div id="status"></div>

</form>

</div>

<script>

const SUPABASE_URL =
"https://rgkfegdtxaojceknnzlr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uK7zrVyq8AlHpoj13pGQ6g_q3L47Akw";

const OWNER_UID =
"96ef4011-2e87-4e4f-8a55-537b0c852d7f";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


document
.getElementById("post-form")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const status =
        document.getElementById("status");

    status.textContent = "publishing...";


    const {
        data: { user },
        error: userError
    } =
        await supabase.auth.getUser();


    if (userError || !user) {

        status.textContent =
        "You are not logged in.";

        return;
    }


    if (user.id !== OWNER_UID) {

        status.textContent =
        "Access denied.";

        return;
    }


    const title =
        document
        .getElementById("title")
        .value
        .trim();


    const content =
        document
        .getElementById("content")
        .value
        .trim();


    const { error } =
        await supabase
        .from("posts")
        .insert({
            title: title,
            content: content,
            user_id: user.id
        });


    if (error) {

        status.textContent =
        "Error: " + error.message;

        return;
    }


    status.textContent =
    "Published ✓";


    document
    .getElementById("post-form")
    .reset();

});

</script>

</body>
</html>
