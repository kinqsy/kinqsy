<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINQSY.LOL — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    background: #F5BACB;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
    padding: 70px 20px;
}
.admin {
    width: min(650px, 100%);
    margin: auto;
    padding: 35px;
    background: rgba(255,255,255,.45);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}
h1 { margin-top: 0; font-size: 48px; letter-spacing: -3px; }
input, textarea {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 1px solid rgba(0,0,0,.15);
    border-radius: 12px;
    background: rgba(255,255,255,.7);
    font-family: Georgia, serif;
    font-size: 16px;
}
textarea { min-height: 220px; resize: vertical; }
label { display: block; margin-top: 20px; font-weight: bold; }
button {
    margin-top: 25px;
    margin-right: 12px;
    padding: 13px 28px;
    border: 0;
    border-radius: 999px;
    background: #885069;
    color: white;
    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
button:hover { opacity: .85; }
#status { margin-top: 20px; font-weight: bold; min-height: 24px; }
#login-box { display: block; }
#admin-box { display: none; }
</style>
</head>
<body>
<div class="admin">
    <h1>admin</h1>

    <!-- LOGIN -->
    <div id="login-box">
        <label>email</label>
        <input id="email" type="email" autocomplete="email">
        <label>password</label>
        <input id="password" type="password" autocomplete="current-password">
        <button id="login-button">login</button>
    </div>

    <!-- ADMIN -->
    <div id="admin-box">
        <p>logged in ✓</p>
        <label>title</label>
        <input id="title" type="text" maxlength="200">
        <label>note</label>
        <textarea id="content" maxlength="10000"></textarea>
        <button id="publish-button">publish</button>
        <button id="logout-button">logout</button>
    </div>

    <div id="status"></div>
</div>

<script>
const SUPABASE_URL = "https://rgkfegdtxaojceknnzlr.supabase.co";
const SUPABASE_KEY = "sb_publishable_uK7zrVyq8AlHpoj13pGQ6g_q3L47Akw";
const OWNER_UID = "96ef4011-2e87-4e4f-8a55-537b0c852d7f";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function checkSession() {
    const { data: { user }, error } = await supabase.auth.getUser();

    if (error) {
        document.getElementById("status").textContent = "Auth error: " + error.message;
        return;
    }

    if (!user) {
        document.getElementById("login-box").style.display = "block";
        document.getElementById("admin-box").style.display = "none";
        return;
    }

    if (user.id !== OWNER_UID) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("admin-box").style.display = "none";
        document.getElementById("status").textContent = "Access denied. You are not the owner.";
        return;
    }

    // Всё ок — показываем админку
    document.getElementById("login-box").style.display = "none";
    document.getElementById("admin-box").style.display = "block";
    document.getElementById("status").textContent = "";
}

document.getElementById("login-button").addEventListener("click", async function () {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
        document.getElementById("status").textContent = error.message;
        return;
    }

    location.reload();
});

document.getElementById("publish-button").
    addEventListener("click", async function () {
    const { data: { user } } = await supabase.auth.getUser();

    if (!user || user.id !== OWNER_UID) {
        document.getElementById("status").textContent = "Access denied.";
        return;
    }

    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!title && !content) {
        document.getElementById("status").textContent = "Title or content required.";
        return;
    }

    const { error } = await supabase.from("posts").insert({
        title: title,
        content: content,
        user_id: user.id
    });

    if (error) {
        document.getElementById("status").textContent = error.message;
        return;
    }

    document.getElementById("status").textContent = "Published ✓";
    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
});

document.getElementById("logout-button").addEventListener("click", async function () {
    await supabase.auth.signOut();
    location.reload();
});

checkSession();
</script>
</body>
</html>
