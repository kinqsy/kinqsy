<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINQSY.LOL — Admin</title>
    <link rel="icon" href="favicon.png" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    background: #F5BACB;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
    padding: 70px 20px;
}
.admin {
    width: min(650px, 100%);
    margin: auto;
    padding: 35px;
    background: rgba(255,255,255,.45);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}
h1 { margin-top: 0; font-size: 48px; letter-spacing: -3px; }
input, textarea, select {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 1px solid rgba(0,0,0,.15);
    border-radius: 12px;
    background: rgba(255,255,255,.7);
    font-family: Georgia, serif;
    font-size: 16px;
}
textarea { min-height: 200px; resize: vertical; }
label { display: block; margin-top: 18px; font-weight: bold; }
.hint { margin-top: 6px; font-size: 13px; opacity: 0.7; font-weight: normal; }
button {
    margin-top: 22px;
    margin-right: 10px;
    padding: 13px 28px;
    border: 0;
    border-radius: 999px;
    background: #885069;
    color: white;
    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
button.secondary { background: #333; }
button:hover { opacity: .85; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
#status { margin-top: 18px; font-weight: bold; min-height: 24px; }
#login-box { display: block; }
#admin-box { display: none; }
#preview {
    margin-top: 12px;
    display: none;
    max-width: 100%;
    border-radius: 14px;
}
    .post-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    margin-top: 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(0,0,0,.08);
}
.post-row-info { min-width: 0; flex: 1; }
.post-row-title {
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.post-row-meta {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 4px;
}
.post-row button.delete-btn {
    margin: 0;
    padding: 8px 14px;
    background: #8b2e2e;
    font-size: 13px;
}
</style>
</head>
<body>
<div class="admin">
    <h1>admin</h1>

    <div id="login-box">
        <label>email</label>
        <input id="email" type="email" autocomplete="email">
        <label>password</label>
        <input id="password" type="password" autocomplete="current-password">
        <button id="login-button">login</button>
    </div>

    <div id="admin-box">
        <p>logged in ✓</p>

        <label>publish to</label>
        <select id="category">
            <option value="notes">notes</option>
            <option value="dreams">dreams</option>
            <option value="quotes">quotation / definition</option>
        </select>

        <label>title</label>
        <input id="title" type="text" maxlength="200">

        <label>text</label>
        <textarea id="content" maxlength="10000"></textarea>

        <label>image / gif url</label>
        <input id="media_url" type="url" placeholder="https://...">

        <label>или загрузи с устройства</label>
        <input id="media_file" type="file" accept="image/*,.gif">
        <div class="hint">JPG, PNG, GIF, WEBP.</div>
        <img id="preview" alt="preview">

       <button id="publish-button">publish</button>
        <button id="logout-button" class="secondary">logout</button>

        <hr style="margin: 28px 0; border: none; border-top: 1px solid rgba(0,0,0,.15);">
        <h2 style="margin: 0 0 12px; font-size: 28px;">my posts</h2>
        <div id="posts-list"></div>
    </div>

    <div id="status"></div>
</div>

<script>
const SUPABASE_URL = "https://rgkfegdtxaojceknnzlr.supabase.co";
const SUPABASE_KEY = "sb_publishable_uK7zrVyq8AlHpoj13pGQ6g_q3L47Akw";

// Если снова Access denied — вставь сюда свой UID из Authentication → Users
const OWNER_UID = "4923abc5-5c86-48c2-904b-a267c2e21703";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function guessMediaType(url) {
    if (!url) return null;
    const u = url.toLowerCase();
    if (u.indexOf(".gif") !== -1) return "gif";
    if (u.indexOf("giphy") !== -1) return "gif";
    if (u.indexOf("tenor") !== -1) return "gif";
    return "image";
}

async function checkSession() {
    const { data: { user }, error } = await supabaseClient.auth.getUser();

    if (error) {
        document.getElementById("login-box").style.display = "block";
        document.getElementById("admin-box").style.display = "none";
        document.getElementById("status").textContent = "";
        return;
    }

    if (!user) {
        document.getElementById("login-box").style.display = "block";
        document.getElementById("admin-box").style.display = "none";
        return;
    }

    if (OWNER_UID && user.id !== OWNER_UID) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("admin-box").style.display = "none";
        document.getElementById("status").textContent = "Access denied. You are not the owner.";
        return;
    }

    document.getElementById("login-box").style.display = "none";
    document.getElementById("admin-box").style.display = "block";
    document.getElementById("status").textContent = "";
    loadMyPosts();
}

document.getElementById("login-button").addEventListener("click", async function () {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const status = document.getElementById("status");
    const btn = document.getElementById("login-button");

    if (!email || !password) {
        status.textContent = "Введите email и пароль";
        return;
    }

    status.textContent = "Вход...";
    btn.disabled = true;

    const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    btn.disabled = false;

    if (error) {
        status.textContent = "Ошибка: " + error.message;
        return;
    }

    status.textContent = "Успешно!";
    setTimeout(function () { location.reload(); }, 400);
});

document.getElementById("media_url").addEventListener("input", function () {
    const url = this.value.trim();
    const preview = document.getElementById("preview");
    if (url) {
        preview.src = url;
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
        preview.removeAttribute("src");
    }
});

document.getElementById("media_file").addEventListener("change", async function () {
    const file = this.files && this.files[0];
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const mediaUrlInput = document.getElementById("media_url");

    if (!file) return;

    status.textContent = "Загружаю файл...";

    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
        status.textContent = "Сначала войди в admin";
        return;
    }

    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = user.id + "/" + Date.now() + "." + ext;

    const { error: uploadError } = await supabaseClient.storage
        .from("media")
        .upload(path, file, {
            cacheControl: "3600",
            upsert: false
        });

    if (uploadError) {
        status.textContent = "Ошибка загрузки: " + uploadError.message;
        return;
    }

    const { data } = supabaseClient.storage.from("media").getPublicUrl(path);
    mediaUrlInput.value = data.publicUrl;
    preview.src = data.publicUrl;
    preview.style.display = "block";
    status.textContent = "Файл загружен ✓";
});

document.getElementById("publish-button").addEventListener("click", async function () {
    const status = document.getElementById("status");
    const btn = document.getElementById("publish-button");
    const { data: { user } } = await supabaseClient.auth.getUser();

    if (!user) {
        status.textContent = "Access denied.";
        return;
    }

    if (OWNER_UID && user.id !== OWNER_UID) {
        status.textContent = "Access denied.";
        return;
    }

    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();
    const category = document.getElementById("category").value;
    const media_url = document.getElementById("media_url").value.trim();

    if (!title && !content && !media_url) {
        status.textContent = "Добавь текст или картинку";
        return;
    }

    btn.disabled = true;
    status.textContent = "Публикую...";
    const payload = {
        title: title,
        content: content,
        category: category,
        user_id: user.id
    };

    if (media_url) {
        payload.media_url = media_url;
        payload.media_type = guessMediaType(media_url);
    }

    const { error } = await supabaseClient.from("posts").insert(payload);

    btn.disabled = false;

    if (error) {
        status.textContent = "Ошибка: " + error.message;
        return;
    }

    status.textContent = "Published to " + category + " ✓";
    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    document.getElementById("media_url").value = "";
    document.getElementById("media_file").value = "";
    document.getElementById("preview").style.display = "none";
    loadMyPosts();
});    
document.getElementById("logout-button").addEventListener("click", async function () {
    await supabaseClient.auth.signOut();
    location.reload();
});
    async function loadMyPosts() {
    const list = document.getElementById("posts-list");
    if (!list) return;

    list.innerHTML = "loading...";

    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
        list.innerHTML = "";
        return;
    }

    const { data, error } = await supabaseClient
        .from("posts")
        .select("id, title, category, created_at")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

    if (error) {
        list.innerHTML = "Ошибка: " + error.message;
        return;
    }

    if (!data || data.length === 0) {
        list.innerHTML = "постов пока нет";
        return;
    }

    list.innerHTML = "";

    data.forEach(function (post) {
        const row = document.createElement("div");
        row.className = "post-row";

        const title = post.title && post.title.trim() ? post.title : "(без названия)";
        const date = new Date(post.created_at).toLocaleDateString("en-GB");

        row.innerHTML =
            '<div class="post-row-info">' +
                '<div class="post-row-title"></div>' +
                '<div class="post-row-meta"></div>' +
            '</div>' +
            '<button type="button" class="delete-btn">delete</button>';

        row.querySelector(".post-row-title").textContent = title;
        row.querySelector(".post-row-meta").textContent = (post.category || "?") + " · " + date;

        row.querySelector(".delete-btn").addEventListener("click", async function () {
            if (!confirm("Удалить пост «" + title + "»?")) return;

            const { error } = await supabaseClient
                .from("posts")
                .delete()
                .eq("id", post.id);

            if (error) {
                alert("Ошибка: " + error.message);
                return;
            }

            row.remove();
            document.getElementById("status").textContent = "Пост удалён ✓";
        });

        list.appendChild(row);
    });
}

checkSession();
</script>
</body>
</html>
