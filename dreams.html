        .dreams-title {

        .feed {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .post {

        -webkit-user-select: none;
        position: relative;
        padding: 28px;

        .post-date {

font-family: Arial, sans-serif;

            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="kinqsy-core.js"></script>
    <script>
(function () {
    var SUPABASE_URL = "https://rgkfegdtxaojceknnzlr.supabase.co";
    var SUPABASE_KEY = "sb_publishable_uK7zrVyq8AlHpoj13pGQ6g_q3L47Akw";
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var OWNER_ID = "4923abc5-5c86-48c2-904b-a267c2e21703";
    var OWNER_SLUG = "kinqsy";
    var viewedUserId = null;
    var activePostMenu = null;

    function escapeHtml(t) {
        return String(t || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function getU() {
        var u = new URLSearchParams(location.search).get("u");
        return (u && u.trim()) ? u.trim() : OWNER_SLUG;
    }

    function menuUrl(page) {
        return page + "?u=" + encodeURIComponent(getU());
    }

    function fixMenu() {
        var map = {
            "nav-home": "index.html",
            "nav-notes": "notes.html",
            "nav-dreams": "dreams.html",
            "nav-quotes": "quotes.html",
            "nav-about": "about.html"
        };
        Object.keys(map).forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.href = menuUrl(map[id]);
        });
    }

    async function resolveViewedUser() {
        fixMenu();
        var slug = getU();
        var label = document.getElementById("dreams-user-label");
        if (label) label.textContent = "dreams · @" + slug;

        var res = await sb.from("profiles").select("id, display_name").ilike("display_name", slug).maybeSingle();
        if (!res.data && slug.toLowerCase() === OWNER_SLUG) {
            res = await sb.from("profiles").select("id, display_name").eq("id", OWNER_ID).maybeSingle();
        }
        viewedUserId = res.data ? res.data.id : (slug.toLowerCase() === OWNER_SLUG ? OWNER_ID : null);
        window.__dreamsViewedUserId = viewedUserId;
        return viewedUserId;
    }

    async function currentUserId() {
        var { data: { session } } = await sb.auth.getSession();
        return session ? session.user.id : null;
    }

    async function canEditPost(post) {
        var uid = await currentUserId();
        if (!uid) return false;
        if (post.user_id && String(post.user_id) === String(uid)) return true;
        return false;
    }

    async function loadComments(postId) {
        var { data, error } = await sb.from("comments").select("*").eq("post_id", postId).order("created_at", { ascending: true });
        if (error) return [];
        return data || [];
    }

    function hidePostMenu() {
        var menu = document.getElementById("post-menu");
        if (menu) menu.classList.remove("open");
        activePostMenu = null;
    }

    function showPostMenuNearFooter(article, post) {
        var menu = document.getElementById("post-menu");
        if (!menu) return;
        var footer = article.querySelector(".post-footer-row") || article.querySelector(".post-footer");
        if (!footer) return;
        activePostMenu = post;
        menu.classList.add("open");
        var rect = footer.getBoundingClientRect();
        var menuW = 160;
        var left = rect.right - menuW;
        var top = rect.top;
        if (left < 8) left = 8;
        if (left + menuW > window.innerWidth - 8) left = window.innerWidth - menuW - 8;
        menu.style.left = left + "px";
        menu.style.top = top + "px";
    }

    async function renderPost(post) {
        var article = document.createElement("article");
        article.className = "post";
        article.id = "post-" + post.id;

        var mediaHtml = "";
        if (post.media_url) {
            mediaHtml = '<div class="post-media"><img src="' + escapeHtml(post.media_url) + '" alt=""></div>';
        }

        var comments = await loadComments(post.id);

        article.innerHTML =
            '<div class="post-date">' + new Date(post.created_at).toLocaleDateString("en-GB") + '</div>' +
            '<h2 class="post-title">' + escapeHtml(post.title || "") + '</h2>' +
            mediaHtml +
            '<div class="post-content">' + escapeHtml(post.content || "") + '</div>' +
            '<div class="post-footer-row">' +
                '<div class="post-footer">comments · ' + comments.length + '</div>' +
                '<button type="button" class="post-owner-btn" aria-label="menu">⋯</button>' +
            '</div>' +
            '<div class="comments">' +
                '<div class="comments-list">' +
                    (comments.length
                        ? comments.map(function (c) {
                            return '<div class="comment"><div class="comment-meta">' +
                                escapeHtml(c.author_name || "гость") + " · " +
                                new Date(c.created_at).toLocaleDateString("en-GB") +
                                '</div><div>' + escapeHtml(c.content) + '</div></div>';
                        }).join("")
                        : '<div class="comment-meta">пока нет комментариев</div>') +
                '</div>' +
                '<form class="comment-form">' +
                    '<input name="author_name" type="text" placeholder="имя" maxlength="40" required>' +
                    '<textarea name="content" placeholder="комментарий" maxlength="500" required></textarea>' +
                    '<button type="submit">отправить</button>' +
                '</form>' +
            '</div>';

        var form = article.querySelector(".comment-form");
        var list = article.querySelector(".comments-list");
        var footer = article.querySelector(".post-footer");

        form.addEventListener("submit", async function (e) {
            e.preventDefault();
            var name = form.querySelector('[name="author_name"]').value.trim();
            var content = form.querySelector('[name="content"]').value.trim();
            if (!name || !content) return;
            var uid = await currentUserId();
            var { error } = await sb.from("comments").insert({
                post_id: post.id,
                author_name: name,
                content: content,
                user_id: uid
            });
            if (error) { alert(error.message); return; }
            form.querySelector('[name="content"]').value = "";
            var fresh = await loadComments(post.id);
            list.innerHTML = fresh.map(function (c) {
                return '<div class="comment"><div class="comment-meta">' +
                    escapeHtml(c.author_name || "гость") + " · " +
                    new Date(c.created_at).toLocaleDateString("en-GB") +
                    '</div><div>' + escapeHtml(c.content) + '</div></div>';
            }).join("") || '<div class="comment-meta">пока нет комментариев</div>';
            footer.textContent = "comments · " + fresh.length;
        });

        var btn = article.querySelector(".post-owner-btn");
        btn.addEventListener("click", async function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (!(await canEditPost(post))) {
                alert("Войди через ★ — править можно только свои сны");
                return;
            }
            if (activePostMenu && String(activePostMenu.id) === String(post.id)) {
                hidePostMenu();
                return;
            }
            showPostMenuNearFooter(article, post);
        });

        return article;
    }

    async function loadDreams() {
        var feed = document.getElementById("feed");
        if (!feed) return;
        feed.innerHTML = '<div class="empty">loading...</div>';

        var uid = await resolveViewedUser();
        if (!uid) {
            feed.innerHTML = '<div class="empty">профиль не найден</div>';
            return;
        }

        var { data, error } = await sb
            .from("posts")
            .select("*")
            .eq("category", "dreams")
            .eq("user_id", uid)
            .order("created_at", { ascending: false });

        if (error) {
            feed.innerHTML = '<div class="empty">Supabase error: ' + error.message + '</div>';
            return;
        }

        if ((!data || !data.length) && getU().toLowerCase() === OWNER_SLUG) {
            var all = await sb.from("posts").select("*").eq("category", "dreams").order("created_at", { ascending: false });
            if (!all.error) {
                data = (all.data || []).filter(function (p) {
                    return !p.user_id || String(p.user_id) === String(uid);
                });
            }
        }

        data = data || [];
        if (!data.length) {
            feed.innerHTML = '<div class="empty">no dreams yet.</div>';
            return;
        }

        feed.innerHTML = "";
        for (var i = 0; i < data.length; i++) {
            feed.appendChild(await renderPost(data[i]));
        }
    }

    // auth + compose
    var authOverlay = document.getElementById("auth-overlay");
    var composeOverlay = document.getElementById("compose-overlay");

    function openAuth() { authOverlay.classList.add("open"); document.getElementById("auth-error").textContent = ""; }
    function closeAuth() { authOverlay.classList.remove("open"); }
    function openCompose() { composeOverlay.classList.add("open"); document.getElementById("compose-error").textContent = ""; }
    window.__openDreamCompose = openCompose;
    function closeCompose() { composeOverlay.classList.remove("open"); }

    /* star -> core */

    document.getElementById("auth-close").onclick = closeAuth;
    document.getElementById("compose-close").onclick = closeCompose;

    document.getElementById("auth-login").onclick = async function () {
        var err = document.getElementById("auth-error");
        err.textContent = "";
        var email = document.getElementById("auth-email").value.trim();
        var password = document.getElementById("auth-password").value;
        var { error } = await sb.auth.signInWithPassword({ email: email, password: password });
        if (error) { err.textContent = error.message; return; }
        closeAuth();
        var uid = await currentUserId();
        var { data: prof } = await sb.from("profiles").select("display_name").eq("id", uid).maybeSingle();
        if (prof && prof.display_name && getU().toLowerCase() !== String(prof.display_name).toLowerCase()) {
            location.href = "dreams.html?u=" + encodeURIComponent(prof.display_name);
            return;
        }
        openCompose();
    };

    document.getElementById("auth-signup").onclick = async function () {
        var err = document.getElementById("auth-error");
        err.textContent = "";
        var email = document.getElementById("auth-email").value.trim();
        var password = document.getElementById("auth-password").value;
        var { data, error } = await sb.auth.signUp({ email: email, password: password });
        if (error) { err.textContent = error.message; return; }
        err.textContent = "аккаунт создан — подтверди почту, потом войди";
        if (data && data.user) {
            var nick = email.split("@")[0].slice(0, 32) || "user";
            var code = "KQ-" + Math.random().toString(36).slice(2, 8).toUpperCase();
            await sb.from("profiles").upsert({
                id: data.user.id,
                display_name: nick,
                friend_code: code,
                updated_at: new Date().toISOString()
            }, { onConflict: "id" });
        }
    };

    var fileInput = document.getElementById("compose-file");
    if (fileInput) fileInput.onchange = function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        if (f.size > 1.5 * 1024 * 1024) { alert("файл до 1.5MB"); return; }
        var reader = new FileReader();
        reader.onload = function () {
            document.getElementById("compose-media").value = reader.result;
            var img = document.getElementById("compose-preview");
            img.style.display = "block"; img.src = reader.result;
        };
        reader.readAsDataURL(f);
    };
    document.getElementById("compose-media").oninput = function () {
        var u = document.getElementById("compose-media").value.trim();
        var img = document.getElementById("compose-preview");
        if (u) { img.style.display = "block"; img.src = u; }
        else { img.style.display = "none"; img.src = ""; }
    };

    document.getElementById("compose-save").onclick = async function () {
        var err = document.getElementById("compose-error");
        err.textContent = "";
        var uid = await currentUserId();
        if (!uid) { err.textContent = "нужен вход"; return; }

        var title = document.getElementById("compose-title").value.trim();
        var content = document.getElementById("compose-content").value.trim();
        var media_url = document.getElementById("compose-media").value.trim();
        if (!title && !content) {
            err.textContent = "напиши заголовок или текст";
            return;
        }

        var payload = {
            title: title,
            content: content,
            category: "dreams",
            user_id: uid,
            title_font: document.getElementById("compose-title-font") ? document.getElementById("compose-title-font").value : null,
            title_color: document.getElementById("compose-title-color") ? document.getElementById("compose-title-color").value : null,
            body_color: document.getElementById("compose-body-color") ? document.getElementById("compose-body-color").value : null
        };
        Object.keys(payload).forEach(function (k) { if (payload[k] == null) delete payload[k]; });
        if (media_url) {
            payload.media_url = media_url;
            payload.media_type = /\.gif(\?|$)/i.test(media_url) ? "gif" : "image";
        }

        var { error } = await sb.from("posts").insert(payload);
        if (error) { err.textContent = error.message; return; }

        document.getElementById("compose-title").value = "";
        document.getElementById("compose-content").value = "";
        document.getElementById("compose-media").value = "";
        document.getElementById("compose-preview").style.display = "none";
        closeCompose();
        await loadDreams();
    };

    document.getElementById("post-menu-delete").onclick = async function () {
        if (!activePostMenu) return;
        if (!confirm("Удалить сон?")) return;
        var { error } = await sb.from("posts").delete().eq("id", activePostMenu.id);
        hidePostMenu();
        if (error) { alert(error.message); return; }
        loadDreams();
    };

    document.getElementById("post-menu-edit").onclick = async function () {
        if (!activePostMenu) return;
        var post = activePostMenu;
        hidePostMenu();
        document.getElementById("edit-title").value = post.title || "";
        document.getElementById("edit-content").value = post.content || "";
        var em = document.getElementById("edit-media");
        if (em) em.value = post.media_url || "";
        window.__editingDreamId = post.id;
        document.getElementById("edit-error").textContent = "";
        document.getElementById("edit-overlay").classList.add("open");
    };
    document.getElementById("edit-close").onclick = function () {
        document.getElementById("edit-overlay").classList.remove("open");
        window.__editingDreamId = null;
    };
    document.getElementById("edit-save").onclick = async function () {
        var err = document.getElementById("edit-error");
        err.textContent = "";
        var id = window.__editingDreamId;
        if (!id) return;
        var payload = {
            title: document.getElementById("edit-title").value.trim(),
            content: document.getElementById("edit-content").value.trim()
        };
        var media = document.getElementById("edit-media");
        if (media && media.value.trim()) payload.media_url = media.value.trim();
        var tf = document.getElementById("edit-title-font");
        if (tf) payload.title_font = tf.value;
        var tc = document.getElementById("edit-title-color");
        if (tc) payload.title_color = tc.value;
        var bc = document.getElementById("edit-body-color");
        if (bc) payload.body_color = bc.value;
        var { error } = await sb.from("posts").update(payload).eq("id", id);
        if (error) {
            var r2 = await sb.from("posts").update({ title: payload.title, content: payload.content }).eq("id", id);
            if (r2.error) { err.textContent = r2.error.message; return; }
        }
        document.getElementById("edit-overlay").classList.remove("open");
        loadDreams();
    };

    document.addEventListener("click", function (e) {
        var menu = document.getElementById("post-menu");
        if (!menu || !menu.classList.contains("open")) return;
        if (e.target.closest("#post-menu") || e.target.closest(".post-owner-btn")) return;
        hidePostMenu();
    });

    loadDreams();
})();
    </script>

<script>
(function () {
  if (!window.Kinqsy) return;
  Kinqsy.init({
    onLoginSuccess: async function () {
      var openCompose = window.__openDreamCompose;
      if (typeof openCompose === "function") openCompose();
      else location.reload();
    },
    onStarLoggedIn: async function (uid) {
      var viewed = window.__dreamsViewedUserId;
      if (viewed && String(viewed) !== String(uid)) {
        alert("Чужой дневник. Свой: dreams.html?u=ТВОЙ_НИК");
        return;
      }
      if (typeof window.__openDreamCompose === "function") window.__openDreamCompose();
    }
  });
})();
</script>

<script>
document.addEventListener("contextmenu", function (e) {
  if (e.target && e.target.closest && e.target.closest(".post-media")) e.preventDefault();
});
</script>
</body>
</html>
