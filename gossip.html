<!DOCTYPE html>
<html lang="ru">
<head>
<script src="kinqsy-boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOSSIP — KINQSY.LOL</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="kinqsy-theme.css">
<link rel="stylesheet" href="kinqsy-skins.css">
<link rel="stylesheet" href="kinqsy-finish.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
body { color: #f4e3ea; font-family: Georgia, serif; }
::selection { background: rgba(240,201,214,.9); color: #3a2030; }

/* ---------- верхнее меню (как на других страницах, чуть плотнее на тёмном фоне) ---------- */
.top-menu {
  position: fixed; top: 0; left: 0; width: 100%; height: 42px;
  background: rgba(20,8,14,.30); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid rgba(240,201,214,.16);
  display: flex; align-items: center; justify-content: center; gap: 18px; z-index: 1000;
}
.top-menu a { color: #f0c9d6; text-decoration: none; font-size: 21px; font-weight: bold; white-space: nowrap; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
.top-menu a:hover { color: #fff; }
.top-menu .star { margin-left: 6px; cursor: pointer; color: #f0c9d6; font-size: 18px; opacity: .85; }
.top-menu .star:hover { opacity: 1; }

/* ---------- фон: медленно плывущие винные пятна (только transform, без blur-фильтров) ---------- */
.g-bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; z-index: 0; overflow: hidden; pointer-events: none;
  background: linear-gradient(165deg, #0c0508 0%, #190a13 48%, #0f0710 100%);
  contain: layout paint;
}
.g-bg i { position: absolute; display: block; border-radius: 50%; will-change: transform; }
.g-bg .b1 { width: 80vmax; height: 80vmax; left: -24vmax; top: -28vmax;
  background: radial-gradient(closest-side, rgba(122,31,56,.62), rgba(122,31,56,0));
  animation: gDrift1 38s ease-in-out infinite alternate; }
.g-bg .b2 { width: 74vmax; height: 74vmax; right: -30vmax; top: 6vh;
  background: radial-gradient(closest-side, rgba(74,31,84,.60), rgba(74,31,84,0));
  animation: gDrift2 46s ease-in-out infinite alternate; }
.g-bg .b3 { width: 70vmax; height: 70vmax; left: 4vw; bottom: -42vmax;
  background: radial-gradient(closest-side, rgba(176,82,118,.34), rgba(176,82,118,0));
  animation: gDrift3 52s ease-in-out infinite alternate; }
.g-bg .b4 { width: 58vmax; height: 58vmax; right: 10vw; bottom: -32vmax;
  background: radial-gradient(closest-side, rgba(96,22,44,.58), rgba(96,22,44,0));
  animation: gDrift4 42s ease-in-out infinite alternate; }
.g-bg::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 38%, rgba(0,0,0,0) 38%, rgba(0,0,0,.58) 100%);
}
@keyframes gDrift1 { from { transform: translate3d(0,0,0) scale(1); }    to { transform: translate3d(20vmax,14vmax,0) scale(1.18); } }
@keyframes gDrift2 { from { transform: translate3d(0,0,0) scale(1.1); }  to { transform: translate3d(-22vmax,10vmax,0) scale(.92); } }
@keyframes gDrift3 { from { transform: translate3d(0,0,0) scale(.95); }  to { transform: translate3d(24vmax,-14vmax,0) scale(1.2); } }
@keyframes gDrift4 { from { transform: translate3d(0,0,0) scale(1); }    to { transform: translate3d(-16vmax,-18vmax,0) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .g-bg i { animation: none; } }

/* ---------- страница ---------- */
/* Три колонки: 240 + 22 + 860 (лента, как у Notes/Dreams) + 22 + 240 = 1384, плюс поля 2×20 = 1424.
   Боковые колонки равной ширины — лента остаётся ровно по центру и не сжимается. */
.page { position: relative; z-index: 2; padding: 100px 20px 80px; max-width: 1424px; margin: 0 auto; }
.g-layout { display: grid; grid-template-columns: 240px minmax(0, 860px) 240px; gap: 22px; justify-content: center; align-items: start; }
.g-center { min-width: 0; }
.g-side { min-width: 0; }
/* не хватает места для трёх колонок (с запасом на полосу прокрутки): лента — обычной ширины, как Notes;
   боковые блоки — компактной парой над лентой */
@media (max-width: 1444px) {
  .page { max-width: 900px; }
  .g-layout { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .g-center { display: contents; }
  .g-head, .g-trending, .filters, .compose, #feed { grid-column: 1 / -1; margin: 0; }
  .g-head { order: 1; margin-bottom: 8px; }
  .g-trending { order: 2; }
  .g-left { order: 3; }
  .g-right { order: 4; }
  .filters { order: 5; }
  .compose { order: 6; }
  #feed { order: 7; }
}
@media (max-width: 640px) {
  .g-layout { grid-template-columns: minmax(0, 1fr); }
}

/* заголовок: те же классы, размеры и цвета, что у ABOUT/NOTES/DREAMS (цвет задаёт общий kinqsy-skins.css) */
.g-head { margin: 0 0 18px; user-select: none; -webkit-user-select: none; }
.kq-title { font-size: var(--kq-title) !important; letter-spacing: var(--kq-title-track) !important; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.pill {
  border: 1px solid rgba(240,201,214,.3); background: rgba(240,201,214,.09);
  color: #f0c9d6; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  font-family: inherit;
}
.pill.on, .pill.react.on { background: #f0c9d6; color: #3a2030; border-color: #f0c9d6; }
.pill[disabled], .ghost[disabled] { opacity: .5; cursor: default; }

.card {
  background: rgba(34,14,24,.64); border: 1px solid rgba(240,201,214,.16);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; color: #f4e3ea;
}
.card h3 { margin: 0 0 8px; font-size: 22px; line-height: 1.25; color: #fbeaf1; font-weight: normal; }
.card .body { white-space: pre-wrap; word-break: break-word; font-size: 16px; line-height: 1.5; }
.meta { font-size: 12px; color: rgba(244,227,234,.66); margin-bottom: 8px; font-family: Arial, Helvetica, sans-serif; }
.meta a { color: #f0c9d6; }

.compose {
  display: none; background: rgba(26,12,20,.82); border: 1px solid rgba(240,201,214,.22);
  border-radius: 16px; padding: 14px; margin-bottom: 18px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(0,0,0,.4); color: #f4e3ea;
}
.compose.open { display: block; }
input, textarea, select { font-family: inherit; }
.compose input, .compose textarea, .compose select {
  width: 100%; margin: 0 0 8px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid rgba(240,201,214,.28); background: rgba(10,4,8,.55); color: #f4e3ea;
}
.compose input[type="checkbox"] { width: auto; margin: 0 6px 0 0; }
.compose select option { background: #1a0f14; color: #f4e3ea; }
input::placeholder, textarea::placeholder { color: rgba(244,227,234,.5); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.compose .row select { flex: 1 1 150px; width: auto; margin: 0; }
.ghost { border: 0; background: #f0c9d6; color: #3a2030; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-family: inherit; }
.friend-pick { max-height: 120px; overflow: auto; font-size: 13px; display: none; margin-bottom: 8px; }
#g-err { font-size: 13px; color: #ff9fb8; }

.comments { margin-top: 10px; }
.comments input {
  padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(240,201,214,.28);
  background: rgba(10,4,8,.55); color: #f4e3ea;
}
.comments .c-form { display: flex; gap: 6px; margin-top: 8px; }
.comments .c-form input { flex: 1; width: auto; min-width: 0; }
.c-item { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; font-size: 13px; word-break: break-word; }
.c-item .pill { flex: none; padding: 1px 8px; font-size: 11px; }
.soft { font-size: 13px; opacity: .78; padding: 6px 2px; }
.g-hint { font-size: 12px; opacity: .7; margin: 0 0 8px; }

/* ---------- защита текста публикаций (как на Notes/Dreams: user-select: none, поля ввода — исключение) ---------- */
.card, .card *, .g-mod, .g-mod * {
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
.card input, .card textarea, .card select, .g-mod input {
  -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
}

/* ---------- боковые модули и TRENDING TOPICS ---------- */
.g-cap, .g-mod h2 {
  margin: 0 0 10px; font: 11px/1.3 Arial, Helvetica, sans-serif; letter-spacing: .14em; text-transform: uppercase;
  color: #f0c9d6; font-weight: normal;
}
.g-mod {
  background: rgba(34,14,24,.52); border: 1px solid rgba(240,201,214,.16);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,.30), 0 0 28px rgba(190,70,120,.08);
  border-radius: 16px; padding: 14px 14px 12px; color: #f4e3ea; font-size: 14px; margin-bottom: 14px;
}
.g-mod h2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.g-mod h2 span { min-width: 0; }
.g-plus {
  flex: none; width: 24px; height: 24px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 1px solid rgba(240,201,214,.45); background: rgba(240,201,214,.10); color: #f0c9d6;
  font: 16px/1 Arial, Helvetica, sans-serif; display: flex; align-items: center; justify-content: center;
}
.g-plus:hover { background: #f0c9d6; color: #3a2030; }
.g-item {
  display: block; padding: 8px 10px; margin: 0 0 6px; border-radius: 10px; text-decoration: none;
  color: #f4e3ea; background: rgba(240,201,214,.06); border-left: 2px solid transparent;
  font-size: 14px; line-height: 1.3; word-break: break-word;
}
.g-item:hover { background: rgba(240,201,214,.12); }
.g-item.promoted { border-left-color: #e8a0b8; background: rgba(214,100,148,.14); }
.g-badge {
  display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 999px; font: 10px/16px Arial, sans-serif;
  letter-spacing: .08em; text-transform: uppercase; background: #e8a0b8; color: #3a2030;
}
.g-topics { list-style: none; margin: 0; padding: 0; }
.g-topics li { padding: 6px 10px; margin: 0 0 6px; border-radius: 10px; background: rgba(240,201,214,.06); word-break: break-word; }
.g-topic-form { display: none; margin: 0 0 10px; }
.g-topic-form.open { display: block; }
.g-topic-form input {
  width: 100%; margin: 0 0 6px; padding: 7px 9px; border-radius: 10px;
  border: 1px solid rgba(240,201,214,.28); background: rgba(10,4,8,.55); color: #f4e3ea; font-size: 14px;
}
.g-topic-form .row { margin: 0; gap: 6px; }
.g-topic-form .ghost { padding: 4px 12px; font-size: 13px; }
#g-topic-err { font-size: 12px; color: #ff9fb8; margin-top: 4px; }
.g-trending { margin: 0 0 14px; }
.g-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.g-tag {
  border: 1px solid rgba(240,201,214,.28); background: rgba(34,14,24,.5); color: #f0c9d6;
  border-radius: 999px; padding: 4px 11px; font: 12px Georgia, serif; cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.g-tag small { opacity: .7; margin-left: 4px; font: 11px Arial, sans-serif; }
.g-tag:hover { background: rgba(240,201,214,.16); }
.g-tag.on { background: #f0c9d6; color: #3a2030; border-color: #f0c9d6; }
.compose { scroll-margin-top: 62px; }
.card { scroll-margin-top: 62px; }
</style>
</head>

<div class="g-bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="kinqsy-core.js"></script>
<script>
var CATS = ["confessions","stories","relationships","work","life","random","questions"];
var CAT_LABELS = {
  confessions: "Признания", stories: "Истории", relationships: "Отношения",
  work: "Работа", life: "Жизнь", random: "Случайное", questions: "Вопросы"
};
var VIS_LABELS = { friends: "только друзья", selected: "выбранные друзья", only_me: "только я", kinqsy: "все в Kinqsy" };
var SUPABASE_URL = "https://rgkfegdtxaojceknnzlr.supabase.co";
var SUPABASE_KEY = "sb_publishable_uK7zrVyq8AlHpoj13pGQ6g_q3L47Akw";
var sb = window.__kinqsy_sb || (window.__kinqsy_sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storageKey: "kinqsy-auth" } }));
var filterCat = "";
var pendingDelete = null;
var myId = null;
var busy = {};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function friendlyError(err, fallback) {
  if (err) console.warn("gossip:", err);
  var code = err && err.code ? String(err.code) : "";
  var msg = err && err.message ? String(err.message) : "";
  if (code === "42501" || /row-level security|not allowed|permission denied/i.test(msg)) return "нет доступа к этой записи";
  if (code === "28000" || /not authenticated|jwt/i.test(msg)) return "нужен вход";
  if (/Failed to fetch|NetworkError|timeout/i.test(msg)) return "нет связи, попробуй ещё раз";
  return fallback || "не получилось, попробуй ещё раз";
}

async function sessionUid() {
  var res = await sb.auth.getSession();
  var session = res && res.data ? res.data.session : null;
  return session ? session.user.id : null;
}

function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "long" }); } catch (e) { return ""; }
}

var catCounts = null; // сколько публикаций каждой категории среди последних загруженных (только реальные данные ленты)

function syncCategoryUi() {
  document.querySelectorAll("#filters .pill").forEach(function (x) {
    x.classList.toggle("on", (x.getAttribute("data-cat") || "") === filterCat);
  });
  document.querySelectorAll("#g-trending .g-tag").forEach(function (x) {
    x.classList.toggle("on", x.getAttribute("data-cat") === filterCat);
  });
}

function setCategory(cat) {
  filterCat = cat || "";
  syncCategoryUi();
  loadFeed();
}

function renderFilters() {
  var box = document.getElementById("filters");
  box.innerHTML = '<button type="button" class="pill on" data-cat="">все</button>' +
    CATS.map(function (c) { return '<button type="button" class="pill" data-cat="' + c + '">' + esc(CAT_LABELS[c]) + '</button>'; }).join("");
  box.onclick = function (e) {
    var b = e.target.closest("[data-cat]");
    if (!b) return;
    setCategory(b.getAttribute("data-cat") || "");
  };
}

/* TRENDING TOPICS — общие темы площадки = системные категории Gossip.
   Порядок — по числу публикаций среди последних загруженных (простой подсчёт, не рейтинг популярности). */
function renderTrending() {
  var box = document.getElementById("g-trending");
  var list = CATS.slice();
  if (catCounts) {
    list.sort(function (a, b) { return (catCounts[b] || 0) - (catCounts[a] || 0) || CATS.indexOf(a) - CATS.indexOf(b); });
  }
  box.innerHTML = list.map(function (c) {
    var n = catCounts && catCounts[c] ? '<small>' + catCounts[c] + '</small>' : "";
    return '<button type="button" class="g-tag" data-cat="' + c + '">' + esc(CAT_LABELS[c]) + n + '</button>';
  }).join("");
  syncCategoryUi();
}
document.getElementById("g-trending").onclick = function (e) {
  var b = e.target.closest("[data-cat]");
  if (!b) return;
  var cat = b.getAttribute("data-cat");
  setCategory(cat === filterCat ? "" : cat);
};

/* MOST VIEWED / PROMOTED — готовая структура списка. Данных о просмотрах и продвижении в базе пока нет,
   поэтому список пуст. Когда появится источник, достаточно вызвать renderMostViewed([{id, title, promoted}]). */
function renderMostViewed(items) {
  var box = document.getElementById("g-most-list");
  if (!items || !items.length) { box.innerHTML = '<div class="soft">пока пусто</div>'; return; }
  box.innerHTML = items.map(function (it) {
    return '<a class="g-item' + (it.promoted ? ' promoted' : '') + '" href="#g-' + Number(it.id) + '">' +
      (it.promoted ? '<span class="g-badge">promo</span>' : '') + esc(it.title || "без названия") + '</a>';
  }).join("");
}

/* PERSONAL TOPICS — интерфейс создания тем. Постоянного хранилища (таблицы тем) в базе пока нет,
   поэтому темы живут только в памяти страницы и исчезают после перезагрузки. */
var personalTopics = [];
var TOPICS_PERSISTENT = false;

function renderTopics() {
  var ul = document.getElementById("g-topics");
  ul.innerHTML = personalTopics.length
    ? personalTopics.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("")
    : '<li class="soft" style="background:none;padding-left:0">пока нет тем — создай первую</li>';
  document.getElementById("g-topics-note").textContent = TOPICS_PERSISTENT || !personalTopics.length
    ? "" : "пока темы не сохраняются: после перезагрузки страницы они исчезнут";
}

function closeTopicForm() {
  document.getElementById("g-topic-form").classList.remove("open");
  document.getElementById("g-topic-name").value = "";
  document.getElementById("g-topic-err").textContent = "";
}

function createTopic() {
  var inp = document.getElementById("g-topic-name");
  var err = document.getElementById("g-topic-err");
  var name = inp.value.replace(/\s+/g, " ").trim();
  err.textContent = "";
  if (!name) { err.textContent = "напиши название темы"; return; }
  var low = name.toLowerCase();
  var isSystem = CATS.some(function (c) { return CAT_LABELS[c].toLowerCase() === low; });
  if (isSystem) { err.textContent = "это системная категория, придумай свою тему"; return; }
  if (personalTopics.some(function (t) { return t.toLowerCase() === low; })) { err.textContent = "такая тема уже есть"; return; }
  if (personalTopics.length >= 30) { err.textContent = "слишком много тем"; return; }
  personalTopics.unshift(name);
  renderTopics();
  closeTopicForm();
}

document.getElementById("g-topic-add").onclick = async function () {
  var uid = await sessionUid();
  if (!uid) { if (window.Kinqsy && Kinqsy.openAuth) Kinqsy.openAuth("login"); return; }
  var form = document.getElementById("g-topic-form");
  if (form.classList.contains("open")) { closeTopicForm(); return; }
  form.classList.add("open");
  document.getElementById("g-topic-name").focus();
};
document.getElementById("g-topic-ok").onclick = createTopic;
document.getElementById("g-topic-cancel").onclick = closeTopicForm;
document.getElementById("g-topic-name").onkeydown = function (e) {
  if (e.key === "Enter") { e.preventDefault(); createTopic(); }
  else if (e.key === "Escape") { closeTopicForm(); }
};

async function loadAcceptedFriends() {
  if (!myId) return [];
  var a1 = await sb.from("friendships").select("requester_id,addressee_id").eq("requester_id", myId).eq("status", "accepted");
  var a2 = await sb.from("friendships").select("requester_id,addressee_id").eq("addressee_id", myId).eq("status", "accepted");
  var ids = [];
  (a1.data || []).concat(a2.data || []).forEach(function (r) {
    var o = r.requester_id === myId ? r.addressee_id : r.requester_id;
    if (ids.indexOf(o) < 0) ids.push(o);
  });
  if (!ids.length) return [];
  var res = await sb.from("profiles").select("id, display_name").in("id", ids);
  return res.data || [];
}

async function fillSelected() {
  var wrap = document.getElementById("g-selected");
  wrap.innerHTML = "загрузка…";
  var friends = await loadAcceptedFriends();
  wrap.innerHTML = friends.map(function (f) {
    return '<label><input type="checkbox" value="' + esc(f.id) + '"> @' + esc(f.display_name || "user") + '</label>';
  }).join("<br>") || "пока нет принятых друзей";
}

/* ---------- комментарии и реакции: только через безопасные представления ---------- */

function commentsHtml(postId, rows, enabled) {
  var html = rows.map(function (c) {
    return '<div class="c-item">' + esc(c.content) +
      (c.can_delete ? ' <button type="button" class="pill del-c" data-cid="' + Number(c.id) + '">удалить</button>' : "") +
      '</div>';
  }).join("");
  if (!rows.length && !enabled) html = '<div class="soft">комментарии выключены</div>';
  if (enabled) {
    html += '<div class="c-form"><input data-cinput="' + postId + '" maxlength="1000" placeholder="комментарий">' +
      '<button type="button" class="ghost send-c" data-pid="' + postId + '">ок</button></div>';
  }
  return html;
}

function applyReact(card, r) {
  if (!card) return;
  var h = card.querySelector('.react[data-t="heart"]');
  var b = card.querySelector('.react[data-t="broken"]');
  var hearts = r ? Number(r.hearts) || 0 : 0;
  var broken = r ? Number(r.broken) || 0 : 0;
  if (h) { h.textContent = "♡ " + hearts; h.classList.toggle("on", !!(r && r.my_heart)); }
  if (b) { b.textContent = "♡̸ " + broken; b.classList.toggle("on", !!(r && r.my_broken)); }
}

async function refreshPost(postId) {
  var card = document.getElementById("g-" + postId);
  if (!card) return;
  var cRes = await sb.from("gossip_comments").select("id, post_id, content, created_at, can_delete").eq("post_id", postId).order("created_at", { ascending: true });
  var rRes = await sb.from("gossip_reactions").select("target_id, hearts, broken, my_heart, my_broken").eq("target_kind", "post").eq("target_id", postId);
  var box = card.querySelector("[data-comments]");
  if (box && !cRes.error) box.innerHTML = commentsHtml(postId, cRes.data || [], box.getAttribute("data-enabled") === "1");
  if (!rRes.error) applyReact(card, (rRes.data || [])[0]);
}

async function loadFeed() {
  var feed = document.getElementById("feed");
  feed.innerHTML = '<div class="soft">загрузка…</div>';
  if (!myId) {
    feed.innerHTML = '<div class="soft">войди, чтобы читать gossip</div>';
    return;
  }
  var q = sb.from("gossip_cards")
    .select("id, title, content, gossip_category, visibility, author_mode, author_alias, author_id, author_label, comments_enabled, created_at")
    .order("created_at", { ascending: false }).limit(40);
  if (filterCat) q = q.eq("gossip_category", filterCat);
  var res = await q;
  if (res.error) { feed.innerHTML = '<div class="soft">' + esc(friendlyError(res.error, "gossip сейчас не загружается")) + '</div>'; return; }
  var rows = res.data || [];
  if (!filterCat) {
    catCounts = {};
    rows.forEach(function (r) { if (r.gossip_category) catCounts[r.gossip_category] = (catCounts[r.gossip_category] || 0) + 1; });
    renderTrending();
  }
  if (!rows.length) { feed.innerHTML = '<div class="soft">пока пусто</div>'; return; }

  var ids = rows.map(function (r) { return r.id; });
  var both = await Promise.all([
    sb.from("gossip_comments").select("id, post_id, content, created_at, can_delete").in("post_id", ids).order("created_at", { ascending: true }),
    sb.from("gossip_reactions").select("target_id, hearts, broken, my_heart, my_broken").eq("target_kind", "post").in("target_id", ids)
  ]);
  var cRes = both[0], rRes = both[1];
  var byPost = {}, reactBy = {};
  (cRes.data || []).forEach(function (c) { (byPost[c.post_id] = byPost[c.post_id] || []).push(c); });
  (rRes.data || []).forEach(function (r) { reactBy[r.target_id] = r; });

  feed.innerHTML = "";
  rows.forEach(function (row) {
    var mine = !!(myId && row.author_id && String(row.author_id) === String(myId));
    var who;
    if (row.author_mode === "anon") who = "Аноним";
    else if (row.author_mode === "alias") who = esc(row.author_label || "без имени");
    else who = esc(row.author_label || "user");
    var canLink = row.author_mode === "self" && row.author_id;
    var enabled = row.comments_enabled !== false;
    var card = document.createElement("article");
    card.className = "card";
    card.id = "g-" + row.id;
    card.innerHTML =
      '<div class="meta">' + (canLink ? '<a href="about.html?u=' + encodeURIComponent(row.author_id) + '">' + who + '</a>' : who) +
      ' · ' + esc(CAT_LABELS[row.gossip_category] || "") +
      ' · ' + esc(VIS_LABELS[row.visibility] || "") +
      ' · ' + esc(fmtDate(row.created_at)) + (mine ? ' · твоя запись' : '') + '</div>' +
      '<h3>' + esc(row.title || "без названия") + '</h3>' +
      '<div class="body">' + esc(row.content || "") + '</div>' +
      '<div class="row" style="margin-top:8px">' +
      '<button type="button" class="pill react" data-t="heart" data-id="' + Number(row.id) + '">♡ 0</button>' +
      '<button type="button" class="pill react" data-t="broken" data-id="' + Number(row.id) + '">♡̸ 0</button>' +
      (mine ? '<button type="button" class="pill del-p" data-id="' + Number(row.id) + '">удалить</button>' : '') +
      '</div>' +
      '<div class="comments" data-comments="' + Number(row.id) + '" data-enabled="' + (enabled ? "1" : "0") + '"></div>';
    feed.appendChild(card);
    applyReact(card, reactBy[row.id]);
    var box = card.querySelector("[data-comments]");
    if (cRes.error) box.innerHTML = '<div class="soft">комментарии временно недоступны</div>';
    else box.innerHTML = commentsHtml(row.id, byPost[row.id] || [], enabled);
  });
  if (/^#g-\d+$/.test(location.hash)) {
    var target = document.getElementById(location.hash.slice(1));
    if (target) target.scrollIntoView({ block: "start" });
  }
}

document.getElementById("feed").onclick = async function (e) {
  var delp = e.target.closest(".del-p");
  if (delp) {
    pendingDelete = delp.getAttribute("data-id");
    document.getElementById("del-post-modal").classList.add("open");
    return;
  }
  if (!myId) return;

  var react = e.target.closest(".react");
  if (react) {
    var pid = Number(react.getAttribute("data-id"));
    if (busy["r" + pid]) return;
    busy["r" + pid] = true;
    var r = await sb.rpc("gossip_toggle_reaction", { p_post_id: pid, p_reaction: react.getAttribute("data-t") });
    busy["r" + pid] = false;
    if (r.error) { alert(friendlyError(r.error, "не удалось поставить реакцию")); return; }
    refreshPost(pid);
    return;
  }

  var send = e.target.closest(".send-c");
  if (send) { await sendComment(Number(send.getAttribute("data-pid"))); return; }

  var dc = e.target.closest(".del-c");
  if (dc) {
    var box = dc.closest("[data-comments]");
    var post = box ? Number(box.getAttribute("data-comments")) : null;
    var d = await sb.rpc("gossip_delete_comment", { p_comment_id: Number(dc.getAttribute("data-cid")) });
    if (d.error) { alert(friendlyError(d.error, "не удалось удалить комментарий")); return; }
    if (post) refreshPost(post);
  }
};

document.getElementById("feed").onkeydown = function (e) {
  if (e.key !== "Enter") return;
  var inp = e.target.closest("[data-cinput]");
  if (inp) { e.preventDefault(); sendComment(Number(inp.getAttribute("data-cinput"))); }
};

async function sendComment(pid) {
  if (!myId || busy["c" + pid]) return;
  var inp = document.querySelector('[data-cinput="' + pid + '"]');
  var txt = inp && inp.value.trim();
  if (!txt) return;
  busy["c" + pid] = true;
  // author_name в таблице comments обязателен (NOT NULL). В Gossip настоящее имя туда не пишем:
  // подпись комментатора никогда не показывается, поэтому ставим нейтральную константу.
  var res = await sb.from("comments").insert({ post_id: pid, user_id: myId, author_name: "gossip", content: txt.slice(0, 1000) });
  busy["c" + pid] = false;
  if (res.error) { alert(friendlyError(res.error, "не удалось отправить комментарий")); return; }
  refreshPost(pid);
}

/* защита текста публикаций: только внутри ленты (#feed) и боковых модулей; поля ввода и формы не затрагиваются */
(function () {
  function target(e) { var t = e.target; return t && t.nodeType === 3 ? t.parentNode : t; }
  ["feed", "g-most", "g-personal"].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    ["contextmenu", "copy", "cut", "selectstart", "dragstart"].forEach(function (ev) {
      el.addEventListener(ev, function (e) {
        var t = target(e);
        if (t && t.closest && t.closest("input, textarea, select, [contenteditable]")) return;
        e.preventDefault();
      });
    });
  });
})();

document.getElementById("del-post-no").onclick = function () {
  pendingDelete = null;
  document.getElementById("del-post-modal").classList.remove("open");
};
document.getElementById("del-post-yes").onclick = async function () {
  if (pendingDelete && myId) {
    var res = await sb.from("posts").delete().eq("id", pendingDelete).eq("user_id", myId);
    if (res.error) alert(friendlyError(res.error, "не удалось удалить запись"));
  }
  pendingDelete = null;
  document.getElementById("del-post-modal").classList.remove("open");
  loadFeed();
};

/* ---------- форма публикации ---------- */

document.getElementById("g-mode").onchange = function () {
  document.getElementById("g-alias").style.display = this.value === "alias" ? "block" : "none";
};
document.getElementById("g-vis").onchange = function () {
  document.getElementById("g-selected").style.display = this.value === "selected" ? "block" : "none";
  if (this.value === "selected") fillSelected();
};
document.getElementById("g-cancel").onclick = function () {
  document.getElementById("compose").classList.remove("open");
};

async function openCompose() {
  myId = await sessionUid();
  if (!myId) {
    if (window.Kinqsy && Kinqsy.openAuth) Kinqsy.openAuth("login");
    return;
  }
  document.getElementById("compose").classList.add("open");
  document.getElementById("compose").scrollIntoView({ behavior: "smooth", block: "start" });
}

document.getElementById("g-publish").onclick = async function () {
  var btn = this;
  var err = document.getElementById("g-err");
  err.textContent = "";
  if (btn.disabled) return;
  if (!myId) { err.textContent = "нужен вход"; return; }
  var mode = document.getElementById("g-mode").value;
  var vis = document.getElementById("g-vis").value;
  var title = document.getElementById("g-title").value.trim();
  var text = document.getElementById("g-text").value.trim();
  var alias = document.getElementById("g-alias").value.trim();
  if (!title) { err.textContent = "напиши заголовок"; return; }
  if (!text) { err.textContent = "напиши текст"; return; }
  if (mode === "alias" && !alias) { err.textContent = "укажи псевдоним"; return; }
  var selected = [];
  if (vis === "selected") {
    document.querySelectorAll("#g-selected input:checked").forEach(function (x) { selected.push(x.value); });
    if (!selected.length) { err.textContent = "выбери хотя бы одного друга"; return; }
  }
  var row = {
    user_id: myId,
    category: "gossip",
    title: title,
    content: text,
    gossip_category: document.getElementById("g-cat").value,
    author_mode: mode,
    author_alias: mode === "alias" ? alias : null,
    visibility: vis,
    visible_to: vis === "selected" ? selected : null,
    comments_enabled: document.getElementById("g-comments").checked
  };
  btn.disabled = true;
  var res = await sb.from("posts").insert(row);
  btn.disabled = false;
  if (res.error) { err.textContent = friendlyError(res.error, "не получилось опубликовать"); return; }
  document.getElementById("g-title").value = "";
  document.getElementById("g-text").value = "";
  document.getElementById("g-alias").value = "";
  document.getElementById("compose").classList.remove("open");
  loadFeed();
};

(async function init() {
  var sel = document.getElementById("g-cat");
  CATS.forEach(function (c) {
    var o = document.createElement("option");
    o.value = c; o.textContent = CAT_LABELS[c];
    sel.appendChild(o);
  });
  renderFilters();
  renderTrending();
  renderMostViewed([]);
  renderTopics();

  if (window.Kinqsy && Kinqsy.init) {
    // общий вход и «замок» Kinqsy, как на остальных страницах
    Kinqsy.init({
      onLoginSuccess: async function () { myId = await sessionUid(); await loadFeed(); },
      onStarLoggedIn: { label: "написать в gossip", run: function () { return openCompose(); } }
    });
  } else {
    // core не загрузился — не оставляем страницу под служебной шторкой
    document.documentElement.classList.remove("kq-wait");
  }

  myId = await sessionUid();
  await loadFeed();
})();
</script>
