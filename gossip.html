<!DOCTYPE html>
<html lang="ru">
<head>
<script src="kinqsy-boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOSSIP — KINQSY.LOL</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="kinqsy-theme.css">
<link rel="stylesheet" href="kinqsy-skins.css">
<link rel="stylesheet" href="kinqsy-finish.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; color: #111; font-family: Georgia, serif; }
.top-menu {
  position: fixed; top: 0; left: 0; width: 100%; height: 42px;
  background: rgba(240,201,214,.35); backdrop-filter: blur(22px);
  display: flex; align-items: center; justify-content: center; gap: 18px; z-index: 1000;
}
.top-menu a { color: #050505; text-decoration: none; font-size: 21px; font-weight: bold; }
.top-menu .star { margin-left: 6px; cursor: pointer; }
.page { padding: 72px 18px 80px; max-width: 720px; margin: 0 auto; }
.kq-title { font-size: 42px; margin: 0; }
.kq-tagline { opacity: .75; margin: 6px 0 22px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.pill {
  border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12);
  color: #3a2030; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
}
.pill.on { background: #f0c9d6; }
.card {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22);
  backdrop-filter: blur(12px); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;
}
.card h3 { margin: 0 0 6px; font-size: 18px; }
.meta { font-size: 12px; opacity: .7; margin-bottom: 8px; }
.compose {
  display: none; background: rgba(26,15,20,.55); border: 1px solid rgba(255,255,255,.22);
  border-radius: 16px; padding: 14px; margin-bottom: 18px; backdrop-filter: blur(16px);
}
.compose.open { display: block; }
.compose input, .compose textarea, .compose select {
  width: 100%; margin: 0 0 8px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12); color: #3a2030;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.ghost { border: 0; background: rgba(240,201,214,.45); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.friend-pick { max-height: 120px; overflow: auto; font-size: 13px; display: none; margin-bottom: 8px; }
.comments { margin-top: 10px; }
.comments input { width: 70%; padding: 6px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12); }
</style>
</head>
<body data-skin="notes">
<nav class="top-menu">
  <a href="index.html">home</a>
  <a href="notes.html">notes</a>
  <a href="dreams.html">dreams</a>
  <a href="quotes.html">quotation/definition</a>
  <a href="about.html">about</a>
  <span class="star" id="admin-star">★</span>
</nav>
<div class="kq-bg" aria-hidden="true"></div>
<div class="kq-grain" aria-hidden="true"></div>
<main class="page">
  <h1 class="kq-title">GOSSIP</h1>
  <div class="kq-tagline">things I probably shouldn't publish</div>
  <div class="filters" id="filters"></div>
  <div class="compose" id="compose">
    <input id="g-title" maxlength="120" placeholder="заголовок">
    <textarea id="g-text" rows="5" placeholder="текст"></textarea>
    <div class="row">
      <select id="g-cat"></select>
      <select id="g-mode">
        <option value="self">под ником</option>
        <option value="anon">анонимно</option>
        <option value="alias">псевдоним</option>
      </select>
      <select id="g-vis">
        <option value="friends">friends</option>
        <option value="selected">selected</option>
        <option value="only_me">only me</option>
        <option value="kinqsy">kinqsy</option>
      </select>
    </div>
    <input id="g-alias" placeholder="псевдоним" style="display:none">
    <label style="font-size:13px"><input type="checkbox" id="g-comments" checked> комментарии</label>
    <div class="friend-pick" id="g-selected"></div>
    <div class="row">
      <button type="button" class="ghost" id="g-publish">опубликовать</button>
      <button type="button" class="ghost" id="g-cancel">закрыть</button>
    </div>
    <div id="g-err" style="font-size:13px;color:#7a2030"></div>
  </div>
  <div id="feed"></div>
</main>
<div class="auth-overlay" id="del-post-modal">
  <div class="auth-modal">
    <h2>удалить запись?</h2>
    <div class="auth-actions">
      <button type="button" id="del-post-yes" class="danger">да, удалить</button>
      <button type="button" id="del-post-no" class="secondary">нет</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var CATS = ["confessions","stories","relationships","work","life","random","questions"];
var SUPABASE_URL = "https://rgkfegdtxaojceknnzlr.supabase.co";
var SUPABASE_KEY = "sb_publishable_uK7zrVyq8AlHpoj13pGQ6g_q3L47Akw";
var sb = window.__kinqsy_sb || (window.__kinqsy_sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storageKey: "kinqsy-auth" } }));
var filterCat = "";
var pendingDelete = null;
var myId = null;

function esc(s) { return String(s || "").replace(/[&<>]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]; }); }

async function sessionUid() {
  var { data: { session } } = await sb.auth.getSession();
  return session ? session.user.id : null;
}

function renderFilters() {
  var box = document.getElementById("filters");
  box.innerHTML = '<button type="button" class="pill on" data-cat="">все</button>' +
    CATS.map(function (c) { return '<button type="button" class="pill" data-cat="'+c+'">'+c+'</button>'; }).join("");
  box.onclick = function (e) {
    var b = e.target.closest("[data-cat]");
    if (!b) return;
    filterCat = b.getAttribute("data-cat") || "";
    box.querySelectorAll(".pill").forEach(function (x) { x.classList.toggle("on", x === b); });
    loadFeed();
  };
}

async function loadAcceptedFriends() {
  if (!myId) return [];
  var a1 = await sb.from("friendships").select("requester_id,addressee_id").eq("requester_id", myId).eq("status", "accepted");
  var a2 = await sb.from("friendships").select("requester_id,addressee_id").eq("addressee_id", myId).eq("status", "accepted");
  var ids = [];
  (a1.data || []).concat(a2.data || []).forEach(function (r) {
    var o = r.requester_id === myId ? r.addressee_id : r.requester_id;
    if (ids.indexOf(o) < 0) ids.push(o);
  });
  if (!ids.length) return [];
  var { data } = await sb.from("profiles").select("id, display_name").in("id", ids);
  return data || [];
}

async function fillSelected() {
  var wrap = document.getElementById("g-selected");
  var friends = await loadAcceptedFriends();
  wrap.innerHTML = friends.map(function (f) {
    return '<label><input type="checkbox" value="'+f.id+'"> @'+esc(f.display_name || "user")+'</label>';
  }).join("<br>") || "нет принятых друзей";
}

async function loadComments(postId, box) {
  var { data } = await sb.from("comments").select("id, user_id, content, created_at").eq("post_id", postId).order("created_at");
  var rows = data || [];
  box.innerHTML = rows.map(function (c) {
    var mine = myId && String(c.user_id) === String(myId);
    return '<div class="meta" data-cid="'+c.id+'">'+(mine ? '<button type="button" class="pill del-c" data-cid="'+c.id+'">удалить</button> ' : "")+esc(c.content)+'</div>';
  }).join("") +
    '<div><input data-cinput="'+postId+'" placeholder="комментарий"><button type="button" class="ghost send-c" data-pid="'+postId+'">ок</button></div>';
}

async function loadReacts(postId, el) {
  var { data } = await sb.from("reactions").select("type, user_id").eq("post_id", postId);
  var heart = (data || []).filter(function (r) { return r.type === "heart" || r.type === "like"; }).length;
  var broken = (data || []).filter(function (r) { return r.type === "broken"; }).length;
  el.textContent = "♡ " + heart + "  ♡̸ " + broken;
}

async function loadFeed() {
  var feed = document.getElementById("feed");
  feed.textContent = "…";
  var q = sb.from("gossip_cards").select("id, title, content, gossip_category, visibility, author_mode, author_alias, author_id, author_label, comments_enabled, created_at").order("created_at", { ascending: false }).limit(40);
  if (filterCat) q = q.eq("gossip_category", filterCat);
  var { data, error } = await q;
  if (error) { feed.textContent = error.message; return; }
  var rows = data || [];
  if (!rows.length) { feed.textContent = "пусто"; return; }
  feed.innerHTML = "";
  rows.forEach(function (row) {
    var card = document.createElement("article");
    card.className = "card";
    card.id = "g-" + row.id;
    var who = esc(row.author_label || "Anonymous");
    var canLink = row.author_mode === "self" && row.author_id;
    card.innerHTML =
      '<div class="meta">'+(canLink ? '<a href="about.html?u='+encodeURIComponent(row.author_id)+'">'+who+'</a>' : who)+
      ' · '+esc(row.gossip_category || "")+' · '+esc(row.visibility || "")+'</div>'+
      '<h3>'+esc(row.title || "без названия")+'</h3>'+
      '<div>'+esc(row.content || "")+'</div>'+
      '<div class="row" style="margin-top:8px">'+
      '<button type="button" class="pill react" data-t="heart" data-id="'+row.id+'">♡</button>'+
      '<button type="button" class="pill react" data-t="broken" data-id="'+row.id+'">♡̸</button>'+
      '<span class="meta react-count" data-rc="'+row.id+'"></span>'+
      (myId && row.author_id && String(row.author_id) === String(myId) ? '<button type="button" class="pill del-p" data-id="'+row.id+'">удалить</button>' : '')+
      '</div>'+
      (row.comments_enabled !== false ? '<div class="comments" data-comments="'+row.id+'"></div>' : '');
    feed.appendChild(card);
    var rc = card.querySelector("[data-rc]");
    loadReacts(row.id, rc);
    var cbox = card.querySelector("[data-comments]");
    if (cbox) loadComments(row.id, cbox);
  });
}

document.getElementById("feed").onclick = async function (e) {
  var delp = e.target.closest(".del-p");
  if (delp) {
    pendingDelete = delp.getAttribute("data-id");
    document.getElementById("del-post-modal").classList.add("open");
    return;
  }
  var react = e.target.closest(".react");
  if (react && myId) {
    var pid = Number(react.getAttribute("data-id"));
    var t = react.getAttribute("data-t");
    await sb.from("reactions").delete().eq("post_id", pid).eq("user_id", myId);
    await sb.from("reactions").insert({ post_id: pid, user_id: myId, type: t });
    var el = document.querySelector('[data-rc="'+pid+'"]');
    if (el) loadReacts(pid, el);
    return;
  }
  var send = e.target.closest(".send-c");
  if (send && myId) {
    var pid = Number(send.getAttribute("data-pid"));
    var inp = document.querySelector('[data-cinput="'+pid+'"]');
    var txt = inp && inp.value.trim();
    if (!txt) return;
    var { error } = await sb.from("comments").insert({ post_id: pid, user_id: myId, content: txt });
    if (!error) {
      var box = document.querySelector('[data-comments="'+pid+'"]');
      if (box) loadComments(pid, box);
    }
    return;
  }
  var dc = e.target.closest(".del-c");
  if (dc && myId) {
    await sb.from("comments").delete().eq("id", dc.getAttribute("data-cid")).eq("user_id", myId);
    var box = dc.closest("[data-comments]");
    if (box) loadComments(box.getAttribute("data-comments"), box);
  }
};

document.getElementById("del-post-no").onclick = function () {
  pendingDelete = null;
  document.getElementById("del-post-modal").classList.remove("open");
};
document.getElementById("del-post-yes").onclick = async function () {
  if (pendingDelete && myId) await sb.from("posts").delete().eq("id", pendingDelete).eq("user_id", myId);
  pendingDelete = null;
  document.getElementById("del-post-modal").classList.remove("open");
  loadFeed();
};

document.getElementById("g-mode").onchange = function () {
  document.getElementById("g-alias").style.display = this.value === "alias" ? "block" : "none";
};
document.getElementById("g-vis").onchange = function () {
  document.getElementById("g-selected").style.display = this.value === "selected" ? "block" : "none";
  if (this.value === "selected") fillSelected();
};
document.getElementById("g-cancel").onclick = function () {
  document.getElementById("compose").classList.remove("open");
};
document.getElementById("g-publish").onclick = async function () {
  var err = document.getElementById("g-err");
  err.textContent = "";
  if (!myId) { err.textContent = "нужен вход"; return; }
  var mode = document.getElementById("g-mode").value;
  var vis = document.getElementById("g-vis").value;
  var selected = [];
  if (vis === "selected") {
    document.querySelectorAll("#g-selected input:checked").forEach(function (x) { selected.push(x.value); });
  }
  var row = {
    user_id: myId,
    category: "gossip",
    title: document.getElementById("g-title").value.trim(),
    content: document.getElementById("g-text").value.trim(),
    gossip_category: document.getElementById("g-cat").value,
    author_mode: mode,
    author_alias: mode === "alias" ? document.getElementById("g-alias").value.trim() : null,
    visibility: vis,
    visible_to: vis === "selected" ? selected : null,
    comments_enabled: document.getElementById("g-comments").checked
  };
  var { error } = await sb.from("posts").insert(row);
  if (error) { err.textContent = error.message; return; }
  document.getElementById("compose").classList.remove("open");
  loadFeed();
};

document.getElementById("admin-star").onclick = async function () {
  myId = await sessionUid();
  if (!myId) return;
  document.getElementById("compose").classList.toggle("open");
};

(async function init() {
  CATS.forEach(function (c) {
    var o = document.createElement("option");
    o.value = c; o.textContent = c;
    document.getElementById("g-cat").appendChild(o);
  });
  renderFilters();
  myId = await sessionUid();
  await loadFeed();
})();
</script>
<script src="kinqsy-player.js"></script>
</body>
</html>
