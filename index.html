    <script>
(function () {
    var SUPABASE_URL = "https://rgkfegdtxaojceknnzlr.supabase.co";
    var SUPABASE_KEY = "sb_publishable_uK7zrVyq8AlHpoj13pGQ6g_q3L47Akw";
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var OWNER_SLUG = "kinqsy";
    var OWNER_ID = "4923abc5-5c86-48c2-904b-a267c2e21703";
    var viewedUserId = null;
    var viewedSlug = OWNER_SLUG;

    function getU() {
        var u = new URLSearchParams(location.search).get("u");
        return (u && u.trim()) ? u.trim() : OWNER_SLUG;
    }

    function menuUrl(page) {
        return page + "?u=" + encodeURIComponent(getU());
    }

    function fixMenu() {
        var map = {
            "nav-home": "index.html",
            "nav-notes": "notes.html",
            "nav-dreams": "dreams.html",
            "nav-quotes": "quotes.html",
            "nav-about": "about.html"
        };
        Object.keys(map).forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.href = menuUrl(map[id]);
        });
    }

    function escapeHtml(s) {
        return String(s || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function excerpt(t) {
        t = String(t || "").trim();
        if (t.length <= 90) return t;
        return t.slice(0, 90) + "…";
    }

    function pageForCategory(cat) {
        cat = String(cat || "notes").toLowerCase();
        if (cat === "dreams" || cat === "dream") return menuUrl("dreams.html");
        if (cat === "quotes" || cat === "quote" || cat === "quotation") return menuUrl("quotes.html");
        return menuUrl("notes.html");
    }

    async function resolveProfile() {
        viewedSlug = getU();
        fixMenu();
        document.getElementById("diary-label").innerHTML =
            "дневник <strong>@" + escapeHtml(viewedSlug) + "</strong>" +
            (viewedSlug.toLowerCase() !== OWNER_SLUG
                ? ' · <a href="index.html">← kinqsy</a>'
                : "");

        var res = await sb.from("profiles").select("id, display_name").ilike("display_name", viewedSlug).maybeSingle();
        if (!res.data && viewedSlug.toLowerCase() === OWNER_SLUG) {
            res = await sb.from("profiles").select("id, display_name").eq("id", OWNER_ID).maybeSingle();
        }
        viewedUserId = res.data ? res.data.id : (viewedSlug.toLowerCase() === OWNER_SLUG ? OWNER_ID : null);
        return viewedUserId;
    }

    async function loadHome() {
        var counter = document.getElementById("post-counter");
        var latest = document.getElementById("latest-posts");
        var uid = await resolveProfile();

        if (!uid) {
            if (counter) counter.textContent = "профиль не найден";
            if (latest) latest.innerHTML = '<div class="home-card-text">нет такого дневника</div>';
            window.__allPosts = [];
            return;
        }

        var { data, error, count } = await sb
            .from("posts")
            .select("id, title, content, category, created_at, user_id", { count: "exact" })
            .eq("user_id", uid)
            .order("created_at", { ascending: false });

        if (error) {
            // fallback: старые посты без user_id — только для kinqsy
            if (viewedSlug.toLowerCase() === OWNER_SLUG) {
                var all = await sb.from("posts").select("id, title, content, category, created_at, user_id", { count: "exact" }).order("created_at", { ascending: false });
                data = (all.data || []).filter(function (p) {
                    return !p.user_id || p.user_id === uid;
                });
                count = data.length;
                error = all.error;
            }
        }

        if (error && !data) {
            counter.textContent = "couldn't load posts";
            latest.textContent = error.message;
            return;
        }

        var posts = data || [];
        if (counter) counter.textContent = "posts · " + (count != null ? count : posts.length) + " · @" + viewedSlug;
        window.__allPosts = posts;

        var top = posts.slice(0, 3);
        if (!top.length) {
            latest.innerHTML = '<div class="home-card-text">пока нет постов</div>';
            return;
        }

        latest.innerHTML = top.map(function (p) {
            var href = pageForCategory(p.category) + "#post-" + p.id;
            var title = p.title && p.title.trim() ? p.title : "(untitled)";
            return (
                '<a class="home-card" href="' + href + '">' +
                    '<div class="home-card-meta">' + escapeHtml(p.category || "notes") +
                        " · " + new Date(p.created_at).toLocaleDateString("en-GB") +
                    "</div>" +
                    '<div class="home-card-title">' + escapeHtml(title) + "</div>" +
                    '<div class="home-card-text">' + escapeHtml(excerpt(p.content)) + "</div>" +
                "</a>"
            );
        }).join("");
    }

    document.getElementById("open-something").onclick = function () {
        var posts = window.__allPosts || [];
        if (!posts.length) {
            alert("Пока нечего открывать");
            return;
        }
        var p = posts[Math.floor(Math.random() * posts.length)];
        location.href = pageForCategory(p.category) + "#post-" + p.id;
    };

    // заголовок → всегда на kinqsy
    document.getElementById("site-title").onclick = function () {
        location.href = "index.html";
    };

    // цитата → предложить добавить
        document.getElementById("home-quotes").onclick = function () {
        var text = prompt("Предложи цитату (текст):");
        if (!text || !text.trim()) return;
        var author = prompt("Автор (можно пусто):") || "";
        try {
            var key = "kinqsy_suggestions";
            var arr = JSON.parse(localStorage.getItem(key) || "[]");
            arr.push({ type: "quote", text: text.trim(), author: author, at: new Date().toISOString() });
            localStorage.setItem(key, JSON.stringify(arr));
        } catch (e) {}
        alert("Отправлено в предложения. Увидишь в admin (жалобы/предложения).");
    };

    var quotes = [
        { t: "Мы — то, что мы постоянно делаем. Совершенство, следовательно, не действие, а привычка.", a: "Аристотель" },
        { t: "Как только вы вообразите, что не в состоянии выполнить дело, с этого момента оно становится невозможным.", a: "Спиноза" },
        { t: "Не всё то потеряно, что не достигнуто.", a: "—" },
        { t: "Слова — это действия.", a: "—" },
        { t: "Тишина тоже ответ.", a: "—" }
    ];
    (function loadQuote() {
        var hourIndex = Math.floor(Date.now() / 3600000);
        var q = quotes[hourIndex % quotes.length];
        document.getElementById("home-quote-text").textContent = q.t;
        document.getElementById("home-quote-author").textContent = q.a;
    })();

    // auth UI
    var authOverlay = document.getElementById("auth-overlay");
    function openAuth() {
        authOverlay.classList.add("open");
        document.getElementById("auth-error").textContent = "";
    }
    function closeAuth() {
        authOverlay.classList.remove("open");
    }

    async function refreshAuthChip() {
        var { data: { session } } = await sb.auth.getSession();
        var chip = document.getElementById("auth-chip");
        var text = document.getElementById("auth-chip-text");
        if (session && session.user) {
            var { data: prof } = await sb.from("profiles").select("display_name, friend_code").eq("id", session.user.id).maybeSingle();
            var name = (prof && prof.display_name) ? prof.display_name : session.user.email;
            var code = (prof && prof.friend_code) ? prof.friend_code : "—";
            text.textContent = "вы: @" + name + " · код " + code;
            chip.classList.add("show");
        } else {
            chip.classList.remove("show");
        }
    }

    /* star handled by kinqsy-core */

    document.getElementById("auth-close").onclick = closeAuth;
    document.getElementById("auth-overlay").onclick = function (e) {
        if (e.target === authOverlay) closeAuth();
    };

    var __al = document.getElementById("auth-login"); if (__al) __al.onclick = async function () {
        var err = document.getElementById("auth-error");
        err.textContent = "";
        var email = document.getElementById("auth-email").value.trim();
        var password = document.getElementById("auth-password").value;
        var { error } = await sb.auth.signInWithPassword({ email: email, password: password });
        if (error) { err.textContent = error.message; return; }
        closeAuth();
        await refreshAuthChip();
        var { data: { session } } = await sb.auth.getSession();
        if (session) {
            var { data: prof } = await sb.from("profiles").select("display_name").eq("id", session.user.id).maybeSingle();
            if (prof && prof.display_name) {
                location.href = "index.html?u=" + encodeURIComponent(prof.display_name);
            }
        }
    };

    var __as = document.getElementById("auth-signup"); if (__as) __as.onclick = async function () {
        var err = document.getElementById("auth-error");
        err.textContent = "";
        var email = document.getElementById("auth-email").value.trim();
        var password = document.getElementById("auth-password").value;
        var { data, error } = await sb.auth.signUp({ email: email, password: password });
        if (error) { err.textContent = error.message; return; }
        err.textContent = "аккаунт создан — подтверди почту, потом войди";
        if (data && data.user) {
            var nick = email.split("@")[0].slice(0, 32) || "user";
            var code = "KQ-" + Math.random().toString(36).slice(2, 8).toUpperCase();
            await sb.from("profiles").upsert({
                id: data.user.id,
                display_name: nick,
                friend_code: code,
                updated_at: new Date().toISOString()
            }, { onConflict: "id" });
            var box = document.getElementById("auth-code");
            box.style.display = "block";
            box.innerHTML = "ник: <strong>" + escapeHtml(nick) + "</strong><br>код: <strong>" + code + "</strong>";
        }
    };

    var __ao = document.getElementById("auth-logout"); if (__ao) __ao.onclick = async function () {
        await sb.auth.signOut();
        await refreshAuthChip();
    };

    sb.auth.onAuthStateChange(function () {
        refreshAuthChip();
    });

    try { refreshAuthChip(); } catch (e) { console.error(e); }
    try { loadHome(); } catch (e) { console.error(e); }
})();
    </script>

<script>
(function () {
  if (!window.Kinqsy) return;
  Kinqsy.fixMenu();
  Kinqsy.init({
    onLoginSuccess: async function () {
      var prof = await Kinqsy.currentProfile();
      if (prof && prof.display_name) {
        location.href = "index.html?u=" + encodeURIComponent(prof.display_name);
      } else {
        location.reload();
      }
    },
    onStarLoggedIn: async function (uid, prof) {
      var name = (prof && prof.display_name) ? prof.display_name : "user";
      var code = (prof && prof.friend_code) ? prof.friend_code : "—";
      document.getElementById("star-modal-title").textContent = "@" + name;
      document.getElementById("star-modal-body").textContent = "код дружбы: " + code;
      document.getElementById("star-modal").classList.add("open");
      document.getElementById("star-modal-about").onclick = function () {
        location.href = "about.html?u=" + encodeURIComponent(name);
      };
      document.getElementById("star-modal-close").onclick = function () {
        document.getElementById("star-modal").classList.remove("open");
      };
    }
  });
  // keep existing loadHome if present — page script still runs
})();
</script>

</body>
</html>
