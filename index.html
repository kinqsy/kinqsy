<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KINQSY.LOL</title>
    <meta name="description" content="things I probably shouldn't publish">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #000;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* =========================
           TOP MENU
        ========================= */

        .top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 42px;

            background: #8d526e;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 18px;

            z-index: 100;
        }

        .top-menu a {
            color: #050505;
            text-decoration: none;

            font-size: 21px;
            font-weight: bold;

            white-space: nowrap;
        }

        .top-menu a:hover {
            text-decoration: underline;
        }


        /* =========================
           HOME
        ========================= */

        .hero {
            position: relative;

            margin-top: 42px;

            min-height: calc(100vh - 42px);

            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            border-radius: 0 0 30px 30px;

            overflow: hidden;
        }


        /* =========================
           TITLE
        ========================= */

        .site-title {
            position: absolute;

            top: 28px;
            left: 0;

            margin: 0;

            color: #f6dce8;

            font-family:
                "Bodoni 72",
                Didot,
                "Bodoni MT",
                "Times New Roman",
                serif;

            font-size: clamp(70px, 10vw, 150px);

            font-weight: 400;

            line-height: 0.9;

            letter-spacing: -5px;

            text-shadow:
                1px 1px 0 #6e4057;

            z-index: 2;
        }

        .tagline {
            position: absolute;

            top: 145px;
            left: 3px;

            color: #f3dce6;

            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(16px, 1.8vw, 26px);

            font-style: italic;
            font-weight: bold;

            z-index: 2;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            min-height: 110px;

            background: #000;

            color: #f1b9d0;

            display: grid;

            grid-template-columns: 1fr auto 1fr;

            align-items: center;

            padding: 20px 28px;
        }

        .copyright {
            font-size: 12px;
            font-weight: bold;
        }

        .socials {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .socials a {
            width: 23px;
            height: 23px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #f1b9d0;
            color: #000;

            text-decoration: none;

            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
        }

        .socials a:hover {
            transform: scale(1.1);
        }

        .footer-right {
            text-align: right;
        }

        .footer-right a {
            color: #f1b9d0;

            font-size: 12px;
            font-weight: bold;

            text-decoration: underline;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .top-menu {
                height: 42px;

                padding: 0 8px;

                gap: 11px;

                overflow-x: auto;

                justify-content: flex-start;

                scrollbar-width: none;
            }

            .top-menu::-webkit-scrollbar {
                display: none;
            }

            .top-menu a {
                font-size: 16px;
            }

            .hero {
                min-height: 80vh;

                margin-top: 42px;

                border-radius: 0 0 20px 20px;

                background-position: center top;
            }

            .site-title {
                top: 35px;
                left: 5px;

                font-size: clamp(55px, 17vw, 100px);

                letter-spacing: -4px;
            }

            .tagline {
                top: 125px;
                left: 7px;

                font-size: 15px;
            }

            footer {
                grid-template-columns: 1fr;

                gap: 18px;

                text-align: center;
            }

            .footer-right {
                text-align: center;
            }
        }
    </style>
</head>


<body>

    <!-- MENU -->

    <nav class="top-menu">

        <a href="index.html">home</a>

        <a href="notes.html">notes</a>

        <a href="dreams.html">dreams</a>

        <a href="quotes.html">quotation/definition</a>

        <a href="about.html">about</a>

    </nav>


    <!-- HOME -->

    <main class="hero">

        <h1 class="site-title">
            KINQSY.LOL
        </h1>

        <div class="tagline">
            things I probably shouldn't publish
        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="copyright">
            © 2026 kinqsy.lol
        </div>


        <div class="socials">

            <a href="#" aria-label="Telegram">✈</a>

            <a href="#" aria-label="Instagram">◎</a>

            <a href="#" aria-label="TikTok">♪</a>

        </div>


        <div class="footer-right">

            <a href="about.html">
                about ↑
            </a>

        </div>

    </footer>

</body>
</html>
