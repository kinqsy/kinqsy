    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #000;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* ===== MENU ===== */
        .top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 42px;
            background: #8d526e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 1000;
        }

        .top-menu a {
            color: #050505;
            text-decoration: none;
            font-size: 21px;
            font-weight: bold;
            white-space: nowrap;
        }

        .top-menu a:hover { text-decoration: underline; }

        .top-menu .star {
            color: #111;
            font-size: 18px;
            opacity: 0.75;
            margin-left: 6px;
            cursor: pointer;
            user-select: none;
        }

        .top-menu .star:hover {
            opacity: 1;
        }

        /* ===== HOME ===== */
        .hero {
            position: relative;
            margin-top: 42px;
            min-height: calc(100vh - 42px);
            background-image: url("background.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            border-radius: 0 0 30px 30px;
            overflow: hidden;
        }

        .site-title {
            position: absolute;
            top: 28px;
            left: 0;
            margin: 0;
            color: #f6dce8;
            font-family: "Bodoni 72", Didot, "Bodoni MT", "Times New Roman", serif;
            font-size: clamp(70px, 10vw, 150px);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -5px;
            text-shadow:
                0 2px 0 #6e4057,
                0 8px 24px rgba(0, 0, 0, 0.45),
                0 2px 8px rgba(0, 0, 0, 0.35);
            z-index: 2;
        }

        .tagline {
            position: absolute;
            top: 165px;
            left: 4px;
            color: #f3dce6;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(16px, 1.8vw, 26px);
            font-style: italic;
            font-weight: bold;
            text-shadow:
                0 1px 0 rgba(110, 64, 87, 0.8),
                0 4px 14px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        /* ===== FOOTER ===== */
        footer {
            min-height: 110px;
            background: #000;
            color: #f1b9d0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 28px;
        }

        .copyright {
            font-size: 12px;
            font-weight: bold;
        }

        .socials {
            display: flex;
            gap: 14px;
            justify-content: center;
            align-items: center;
        }

        .socials a {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1b9d0;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        .socials a:hover {
            opacity: 0.8;
            transform: scale(1.08);
        }

        .socials svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* ===== BACK TO TOP ===== */
        .back-to-top-fixed {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #8d526e;
            color: #f6dce8;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: opacity 0.2s, transform 0.2s;
        }

        .back-to-top-fixed:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 700px) {
            .top-menu {
                height: 42px;
                padding: 0 8px;
                gap: 11px;
                overflow-x: auto;
                justify-content: flex-start;
                scrollbar-width: none;
            }

            .top-menu::-webkit-scrollbar { display: none; }
            .top-menu a { font-size: 16px; }

            .hero {
                min-height: 80vh;
                margin-top: 42px;
                border-radius: 0 0 20px 20px;
            }

            .site-title {
                top: 35px;
                left: 5px;
                font-size: clamp(55px, 17vw, 100px);
                letter-spacing: -4px;
            }

            .tagline {
                top: 145px;
                left: 7px;
                font-size: 15px;
            }

            footer {
                grid-template-columns: 1fr;
                gap: 18px;
                text-align: center;
            }

            .back-to-top-fixed {
                right: 16px;
                bottom: 16px;
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>

    <script>
    (function () {
        const star = document.getElementById("admin-star");
        if (!star) return;

        let clicks = 0;
        let timer = null;

        star.addEventListener("click", function () {
            clicks += 1;

            if (timer) clearTimeout(timer);

            timer = setTimeout(function () {
                clicks = 0;
            }, 1500);

            if (clicks >= 3) {
                clicks = 0;
                window.location.href = "admin.html";
            }
        });
    })();
