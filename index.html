    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;

        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #000;
            font-family: Georgia, "Times New Roman", serif;
        }


        /* =====================================
           TOP MENU
        ===================================== */

        .top-menu {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 42px;

            background: #8d526e;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 18px;

            z-index: 1000;
        }


        .menu-item {
            position: relative;

            display: flex;
            align-items: center;

            color: #050505;
            text-decoration: none;

            font-size: 21px;
            font-weight: bold;

            white-space: nowrap;

            transition:
                transform 0.35s ease,
                letter-spacing 0.35s ease;
        }


        /*
           Слово плавно увеличивается
        */

        .menu-item:hover {
            transform: scale(1.08);
            letter-spacing: 0.3px;
        }


        /*
           Иконка изначально находится
           слева за пределами слова
        */

        .menu-icon {
            position: absolute;

            right: calc(100% + 7px);

            top: 50%;

            transform:
                translateX(-18px)
                translateY(-50%);

            opacity: 0;

            width: 17px;
            height: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;

            transition:
                opacity 0.3s ease,
                transform 0.35s ease;

            pointer-events: none;
        }


        /*
           ПОЛСЕКУНДЫ ЗАДЕРЖКИ,
           потом иконка выезжает
        */

        .menu-item:hover .menu-icon {
            opacity: 1;

            transform:
                translateX(0)
                translateY(-50%);

            transition-delay: 0.5s;
        }


        /* =====================================
           HOME
        ===================================== */

        .hero {
            position: relative;

            margin-top: 42px;

            min-height: calc(100vh - 42px);

            background-image: url("background.jpg");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            border-radius: 0 0 30px 30px;

            overflow: hidden;
        }


        /* =====================================
           KINQSY.LOL

            line-height: 0.9;

            letter-spacing: -5px;
