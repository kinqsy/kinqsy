<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINQSY</title>
<link rel="stylesheet" href="kinqsy-player.css">
<link rel="stylesheet" href="gossip-player.css">
<style>
html, body { margin: 0; height: 100%; background: #000; }
#kq-frame { border: 0; width: 100%; height: 100vh; display: block; }
</style>
</head>
<body>
<iframe id="kq-frame" title="kinqsy"></iframe>
<script>
(function () {
  var frame = document.getElementById("kq-frame");
  var page = "index.html";
  try { page = new URLSearchParams(location.search).get("p") || page; } catch (e) {}
  frame.src = page;
  window.addEventListener("message", function (e) {
    if (e.origin !== location.origin) return;
    if (!e.data || e.data.type !== "kq-nav" || !e.data.path) return;
    frame.src = e.data.path;
    history.replaceState(null, "", "kinqsy-keep.html?p=" + encodeURIComponent(e.data.path));
  });
})();
</script>
<script src="kinqsy-player.js"></script>
</body>
</html>
