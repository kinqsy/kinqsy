<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOTES — KINQSY.LOL</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,.55),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 70%,
                    rgba(255,255,255,.35),
                    transparent 32%
                ),

                #F5BACB;

            color: #000;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        /* =========================
           TOP MENU
        ========================= */

        .top-menu {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 42px;

            background: #885069;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 18px;

            z-index: 1000;

            box-shadow:
                0 2px 12px rgba(0,0,0,.18);

            border-bottom:
                1px solid rgba(255,255,255,.18);
        }


        .top-menu a {

            color: #050505;

            text-decoration: none;

            font-size: 21px;

            font-weight: bold;
        }


        .top-menu a:hover {

            text-decoration: underline;
        }


        /* =========================
           NOTES
        ========================= */

        .notes-page {

            min-height: 100vh;

            padding:
                100px
                20px
                80px;
        }


        .notes-title {

            max-width: 900px;

            margin:
                0
                auto
                20px;

            color: #000;

            font-family:
                "Bodoni 72",
                Didot,
                "Bodoni MT",
                Georgia,
                serif;

            font-size:
                clamp(70px, 11vw, 150px);

            font-weight: 400;

            line-height: .8;

            letter-spacing: -5px;
        }


        .notes-subtitle {

            max-width: 900px;

            margin:
                0
                auto
                45px;

            font-size: 17px;

            font-style: italic;

            font-weight: bold;
        }


        .feed {

            max-width: 900px;

            margin: 0 auto;

            display: flex;

            flex-direction: column;

            gap: 28px;
        }


        /* =========================
           AERO GLASS POST
        ========================= */

        .post {

            position: relative;

            padding: 28px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.28) 0%,
                    rgba(255,255,255,.08) 18%,
                    rgba(255,255,255,.025) 55%,
                    rgba(255,255,255,.12) 100%
                );

            border:
                1px solid rgba(255,255,255,.65);

            box-shadow:

                0 20px 45px
                rgba(80,30,50,.18),

                inset 0 1px 2px
                rgba(255,255,255,.8),

                inset 0 -1px 2px
                rgba(120,50,80,.15);

            backdrop-filter:
                blur(5px)
                saturate(180%);

            -webkit-backdrop-filter:
                blur(5px)
                saturate(180%);

            overflow: hidden;
        }


        .post::before {

            content: "";

            position: absolute;
          top: -35%;
            left: -10%;

            width: 120%;
            height: 65%;

            background:
                linear-gradient(
                    105deg,
                    rgba(255,255,255,.72) 0%,
                    rgba(255,255,255,.32) 18%,
                    rgba(255,255,255,.06) 42%,
                    rgba(255,255,255,0) 70%
                );

            transform:
                rotate(-3deg);

            pointer-events: none;
        }


        .post::after {

            content: "";

            position: absolute;

            top: 1px;
            left: 15%;

            width: 70%;
            height: 2px;

            background:
                rgba(255,255,255,.8);

            filter:
                blur(1px);

            pointer-events: none;
        }


        .post > * {

            position: relative;

            z-index: 2;
        }


        .post-date {

            margin-bottom: 12px;

            font-family:
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 1px;

            text-transform: uppercase;

            opacity: .6;
        }


        .post-title {

            margin:
                0
                0
                15px;

            font-size: 29px;
        }


        .post-content {

            font-size: 17px;

            line-height: 1.65;
        }


        .post-footer {

            margin-top: 24px;

            padding-top: 14px;

            border-top:
                1px solid
                rgba(0,0,0,.16);

            font-family:
                Arial,
                sans-serif;

            font-size: 12px;

            font-weight: bold;
        }


        .empty {

            padding:
                60px
                20px;

            text-align: center;

            font-style: italic;

            opacity: .65;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            min-height: 110px;

            background: #000;

            color: #F1B9D0;

            display: grid;

            grid-template-columns:
                1fr auto 1fr;

            align-items: center;

            padding: 20px 28px;

            box-shadow:
                0 -8px 30px
                rgba(0,0,0,.18);

            border-top:
                1px solid
                rgba(255,255,255,.08);
        }


        .socials {

            display: flex;

            gap: 6px;

            justify-content: center;
        }


        .socials a {

            width: 23px;
            height: 23px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #F1B9D0;

            color: #000;

            text-decoration: none;
        }


        .back-to-top {

            color: #F1B9D0;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .top-menu {

                padding: 0 8px;

                gap: 11px;

                justify-content:
                    flex-start;

                overflow-x: auto;

                scrollbar-width: none;
            }


            .top-menu::-webkit-scrollbar {

                display: none;
            }


            .top-menu a {

                font-size: 16px;
            }


            .notes-page {

                padding:
                    85px
                    12px
                    50px;
            }


            .notes-title {

                font-size:
                    clamp(
                        55px,
                        17vw,
                        100px
                    );

                letter-spacing: -4px;
            }


            .post {padding: 20px;

                border-radius: 15px;
            }


            .post-title {

                font-size: 24px;
            }


            .post-content {

                font-size: 16px;
            }


            footer {

                grid-template-columns: 1fr;

                gap: 18px;

                text-align: center;
            }

        }

    </style>

</head>

    <main class="notes-page">

        </h1>


        <div class="notes-subtitle">

        </div>


        <section class="feed">

            <article class="post">

                <div class="post-date">

                </div>


                <h2 class="post-title">

                </h2>


                <div class="post-content">

                </div>


                <div class="post-footer">

            </article>

        </section>

    </main>


    <footer>

        <div>
            © 2026 kinqsy.lol
        </div>


        <div class="socials">

            <a href="#">✈️</a>

            <a href="#">◎</a>

        </div>


        <div>

            <a

        </div>

    </footer>
