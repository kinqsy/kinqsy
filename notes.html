<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTES — KINQSY.LOL</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        html, body { margin: 0; padding: 0; min-height: 100%; }

        body {
            background: #1a0f14 url("notes-bg.jpg") center center / cover no-repeat fixed;
            color: #000;
            font-family: Georgia, "Times New Roman", serif;
        }

        .top-menu {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 42px;
            background: #885069;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0,0,0,.18);
        }
        .top-menu a {
            color: #050505;
            text-decoration: none;
            font-size: 21px;
            font-weight: bold;
        }
        .top-menu a:hover { text-decoration: underline; }
        .top-menu .star {
            color: #111;
            font-size: 18px;
            opacity: 0.75;
            margin-left: 6px;
            cursor: pointer;
            user-select: none;
        }
        .top-menu .star:hover { opacity: 1; }

        .notes-page {
            min-height: 100vh;
            padding: 100px 20px 80px;
        }

        .notes-title {
            max-width: 900px;
            margin: 0 auto 20px;
            color: #000;
            font-family: "Bodoni 72", Didot, "Bodoni MT", Georgia, serif;
            font-size: clamp(70px, 11vw, 150px);
            font-weight: 400;
            line-height: .8;
            letter-spacing: -5px;
            text-shadow: 0 2px 0 rgba(255,255,255,.35), 0 8px 24px rgba(0,0,0,.25);
        }

        .notes-subtitle {
            max-width: 900px;
            margin: 0 auto 45px;
            font-size: 17px;
            font-style: italic;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,.2);
        }

        .feed {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .post {
            position: relative;
            padding: 28px;
            border-radius: 22px;
            background: linear-gradient(
                145deg,
                rgba(255,255,255,.42) 0%,
                rgba(255,255,255,.16) 40%,
                rgba(255,255,255,.1) 100%
            );
            border: 1px solid rgba(255,255,255,.7);
            box-shadow:
                0 18px 40px rgba(0,0,0,.2),
                inset 0 1px 1px rgba(255,255,255,.9),
                inset 0 -1px 1px rgba(0,0,0,.08);
            backdrop-filter: blur(16px) saturate(160%);
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            overflow: hidden;
        }
        .post::before {
            content: "";
            position: absolute;
            top: -40%; left: -15%;
            width: 130%; height: 70%;
            background: linear-gradient(
                110deg,
                rgba(255,255,255,.7) 0%,
                rgba(255,255,255,.2) 30%,
                rgba(255,255,255,0) 60%
            );
            transform: rotate(-4deg);
            pointer-events: none;
        }
        .post > * { position: relative; z-index: 2; }

        .post-date {
            margin-bottom: 12px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: .6;
        }
        .post-title { margin: 0 0 15px; font-size: 29px; }
        .post-content { font-size: 17px; line-height: 1.65; }
        .post-media { margin: 14px 0 6px; border-radius: 16px; overflow: hidden; }
        .post-media img {
    display: block;
    max-width: 550px;
    max-height: 550px;
    width: 100%;
    height: auto;
    object-fit: contain;
    margin: 0 auto;
    vertical-align: middle;
}
        .post-footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid rgba(0,0,0,.14);
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
        }

        .empty {
            padding: 60px 20px;
            text-align: center;
            font-style: italic;
            opacity: .75;
            background: rgba(255,255,255,.28);
            border-radius: 18px;
            backdrop-filter: blur(10px);
        }

        .comments {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(0,0,0,.12);
        }
        .comment {
            margin-bottom: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,.25);
            font-size: 14px;
            line-height: 1.4;
        }
        .comment-meta {
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            opacity: .65;
            margin-bottom: 4px;
        }
        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .comment-form input,
        .comment-form textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(0,0,0,.15);
            border-radius: 10px;
            background: rgba(255,255,255,.7);
            font-family: Georgia, serif;
            font-size: 14px;
        }
        .comment-form textarea {
            min-height: 70px;
            resize: vertical;
        }
        .comment-form button {
            align-self: flex-start;
            margin-top: 4px;
            padding: 8px 16px;
            border: 0;
            border-radius: 999px;
            background: #885069;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .author-badge {
        color: #6e4057;
        font-weight: 800;
    }
    .reactions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        align-items: center;
    }
    .react-btn {
        border: 0;
        background: rgba(255,255,255,.35);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 14px;
        font-family: Arial, sans-serif;
    }
    .react-btn:hover { background: rgba(255,255,255,.55); }
    .comment-reactions {
        margin-top: 8px;
    }
        footer {
            min-height: 110px;
            background: #000;
            color: #F1B9D0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 28px;
        }
        .socials {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }
        .socials a {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F1B9D0;
            text-decoration: none;
        }
        .socials a:hover { opacity: 0.8; transform: scale(1.08); }
        .socials svg { width: 22px; height: 22px; fill: currentColor; }

        .back-to-top-fixed {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #885069;
            color: #f6dce8;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
        }
        .back-to-top-fixed:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        @media (max-width: 700px) {
            .top-menu {
                padding: 0 8px;
                gap: 11px;
                justify-content: flex-start;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .top-menu::-webkit-scrollbar { display: none; }
            .top-menu a { font-size: 16px; }
            .notes-page { padding: 85px 12px 50px; }
            .notes-title { font-size: clamp(55px, 17vw, 100px); letter-spacing: -4px; }
            .post { padding: 20px; border-radius: 16px; }
            .post-title { font-size: 24px; }
            .post-content { font-size: 16px; }
            footer { grid-template-columns: 1fr; gap: 18px; text-align: center; }
            .back-to-top-fixed { right: 16px; bottom: 16px; width: 40px; height: 40px; }
        }
    </style>
</head>

    <script>
    (function () {
        var star = document.getElementById("admin-star");
        if (!star) return;
        var clicks = 0;
        var timer = null;
        star.onclick = function () {
            clicks = clicks + 1;
            if (timer) clearTimeout(timer);
            timer = setTimeout(function () { clicks = 0; }, 2000);
            if (clicks >= 3) {
                clicks = 0;
                window.location.href = "admin.html";
            }
        };
    })();
    </script>
