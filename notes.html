.post {
    position: relative;

    padding: 28px;

    border-radius: 20px;

    background:
    linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.11),
        rgba(255, 255, 255, 0.025) 45%,
        rgba(255, 255, 255, 0.07)
    );

    border:
        1px solid rgba(255, 255, 255, 0.42);

    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);

    backdrop-filter:
    blur(8px) saturate(180%) brightness(1.08);

    -webkit-backdrop-filter:
        blur(12px) saturate(150%);

    overflow: hidden;
}

        .post::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 55%;

    background:
        linear-gradient(
            115deg,
            rgba(255, 255, 255, 0.42) 0%,
            rgba(255, 255, 255, 0.18) 18%,
            rgba(255, 255, 255, 0.04) 45%,
            rgba(255, 255, 255, 0) 70%
        );

    pointer-events: none;

    opacity: .8;
}
        .post > * {
    position: relative;
    z-index: 1;
}
        .post-title {
            margin: 0 0 15px;
            font-size: 29px;
        }

        .post-content {
            font-size: 17px;
            line-height: 1.65;
        }

        .post-footer {
            margin-top: 24px;
            padding-top: 14px;

            border-top: 1px solid rgba(0, 0, 0, 0.16);

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
        }
        footer {
    min-height: 110px;

    background: #000;

    color: #F1B9D0;

    display: grid;
    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    padding: 20px 28px;

    box-shadow:
        0 -8px 30px rgba(0, 0, 0, 0.18);

    border-top:
        1px solid rgba(255, 255, 255, 0.08);
}

        footer {
