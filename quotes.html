        };
        Object.keys(map).forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.href = menuUrl(map[id]);
        });
    }

    function orderKey() {
        return "kinqsy_quotes_order_" + (viewedUserId || getU());
    }
    function loadOrder() {
        try { return JSON.parse(localStorage.getItem(orderKey()) || "[]"); }
        catch (e) { return []; }
    }
    function saveOrder(ids) {
        localStorage.setItem(orderKey(), JSON.stringify(ids));
    }
    function applySavedOrder(posts) {
        var order = loadOrder();
        if (!order.length) return posts;
        var map = {};
        posts.forEach(function (p) { map[String(p.id)] = p; });
        var sorted = [];
        order.forEach(function (id) {
            if (map[id]) { sorted.push(map[id]); delete map[id]; }
        });
        Object.keys(map).forEach(function (id) { sorted.push(map[id]); });
        return sorted;
    }

    async function currentUserId() {
        var { data: { session } } = await sb.auth.getSession();
        return session ? session.user.id : null;
    }

    async function resolveViewedUser() {
        fixMenu();
        var slug = getU();
        document.getElementById("quotes-user-label").textContent =
            (mode === "public" ? "общая лента" : "моя доска") + " · @" + slug;

        var res = await sb.from("profiles").select("id, display_name").ilike("display_name", slug).maybeSingle();
        if (!res.data && slug.toLowerCase() === OWNER_SLUG) {
            res = await sb.from("profiles").select("id, display_name").eq("id", OWNER_ID).maybeSingle();
        }
        viewedUserId = res.data ? res.data.id : (slug.toLowerCase() === OWNER_SLUG ? OWNER_ID : null);
        var uid = await currentUserId();
        canReorder = mode === "mine" && !!(uid && viewedUserId && String(uid) === String(viewedUserId));
        return viewedUserId;
    }

    async function canEditPost(post) {
        var uid = await currentUserId();
        return !!(uid && post.user_id && String(post.user_id) === String(uid));
    }

    function attrHtml(post) {
        var type = post.attribution_type || "unknown";
        var label = ATTR_LABELS[type] || ATTR_LABELS.unknown;
        var url = post.attribution_url || "";
        var by = post.author_name ? " · @" + escapeHtml(post.author_name) : "";
        if (url && (type === "author" || type === "found")) {
            return '<div class="pin-attr">' + escapeHtml(label) + by +
                ' · <a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">источник</a></div>';
        }
        return '<div class="pin-attr">' + escapeHtml(label) + by + '</div>';
    }

    function hidePostMenu() {
        document.getElementById("post-menu").classList.remove("open");
        activePostMenu = null;
    }

    function persistDomOrder() {
        if (!canReorder) return;
        var ids = Array.prototype.map.call(document.querySelectorAll("#feed .pin"), function (el) {
            return el.dataset.id;
        });
        saveOrder(ids);
    }

    function bindDrag(pin) {
        if (!canReorder) return;
        var handle = pin.querySelector(".pin-handle");
        pin.draggable = true;
        pin.addEventListener("dragstart", function (e) {
            pin.classList.add("dragging");
            e.dataTransfer.setData("text/plain", pin.dataset.id);
        });
        pin.addEventListener("dragend", function () {
            pin.classList.remove("dragging");
            persistDomOrder();
        });
        pin.addEventListener("dragover", function (e) {
            e.preventDefault();
            pin.classList.add("drag-over");
        });
        pin.addEventListener("dragleave", function () { pin.classList.remove("drag-over"); });
        pin.addEventListener("drop", function (e) {
            e.preventDefault();
            pin.classList.remove("drag-over");
            var id = e.dataTransfer.getData("text/plain");
            var dragged = document.querySelector('.pin[data-id="' + id + '"]');
            if (!dragged || dragged === pin) return;
            var feed = document.getElementById("feed");
            var pins = Array.prototype.slice.call(feed.querySelectorAll(".pin"));
            var from = pins.indexOf(dragged);
            var to = pins.indexOf(pin);
            if (from < to) feed.insertBefore(dragged, pin.nextSibling);
            else feed.insertBefore(dragged, pin);
        });

        var touchDrag = null;
        handle.addEventListener("touchstart", function (e) {
            touchDrag = { id: pin.dataset.id };
        }, { passive: true });
        handle.addEventListener("touchmove", function (e) {
            if (!touchDrag) return;
            e.preventDefault();
            var t = e.touches[0];
            var el = document.elementFromPoint(t.clientX, t.clientY);
            var target = el && el.closest ? el.closest(".pin") : null;
            if (!target || target.dataset.id === touchDrag.id) return;
            var feed = document.getElementById("feed");
            var dragged = document.querySelector('.pin[data-id="' + touchDrag.id + '"]');
            if (!dragged) return;
            var pins = Array.prototype.slice.call(feed.querySelectorAll(".pin"));
            var from = pins.indexOf(dragged);
            var to = pins.indexOf(target);
            if (from < to) feed.insertBefore(dragged, target.nextSibling);
            else feed.insertBefore(dragged, target);
        }, { passive: false });
        handle.addEventListener("touchend", function () {
            touchDrag = null;
            persistDomOrder();
        });
    }

    function makePin(post) {
        var pin = document.createElement("article");
        pin.className = "pin";
        pin.dataset.id = String(post.id);

        var titleStyle = "font-family:" + escapeHtml(post.title_font || "Georgia, serif") +
            ";color:" + escapeHtml(post.title_color || "#1a0f14");
        var bodyStyle = "font-family:" + escapeHtml(post.body_font || "Georgia, serif") +
            ";color:" + escapeHtml(post.body_color || "#1a0f14");

        var media = post.media_url
            ? '<img class="pin-media" src="' + escapeHtml(post.media_url) + '" alt="">'
            : "";
        var title = post.title
            ? '<h2 class="pin-title" style="' + titleStyle + '">' + escapeHtml(post.title) + '</h2>'
            : "";
        var text = post.content
            ? '<p class="pin-text" style="' + bodyStyle + '">' + escapeHtml(post.content) + '</p>'
            : "";

        var saveBtn = mode === "public"
            ? '<button type="button" class="pin-btn pin-save" title="сохранить к себе">＋</button>'
            : "";

        pin.innerHTML =
            '<div class="pin-handle">⋮⋮</div>' +
            media +
            '<div class="pin-body">' +
                title + text + attrHtml(post) +
                '<div class="pin-meta">' +
                    '<span>' + new Date(post.created_at).toLocaleDateString("en-GB") + '</span>' +
                    '<div class="pin-actions">' +
                        saveBtn +
                        '<button type="button" class="pin-btn pin-menu-btn">⋯</button>' +
                    '</div>' +
                '</div>' +
            '</div>';

        if (!canReorder) pin.querySelector(".pin-handle").style.display = "none";
        else bindDrag(pin);

        var menuBtn = pin.querySelector(".pin-menu-btn");
        menuBtn.addEventListener("click", async function (e) {
            e.stopPropagation();
            if (!(await canEditPost(post))) {
                alert("Только автор");
                return;
            }
            activePostMenu = post;
            var menu = document.getElementById("post-menu");
            menu.classList.add("open");
            var r = e.currentTarget.getBoundingClientRect();
            menu.style.left = Math.min(r.left, window.innerWidth - 160) + "px";
            menu.style.top = (r.bottom + 4) + "px";
        });

        var saveEl = pin.querySelector(".pin-save");
        if (saveEl) {
            saveEl.addEventListener("click", async function (e) {
                e.stopPropagation();
                var uid = await currentUserId();
                if (!uid) {
                    document.getElementById("auth-overlay").classList.add("open");
                    return;
                }
                var payload = {
                    title: post.title || "",
                    content: post.content || "",
                    media_url: post.media_url || null,
                    media_type: post.media_type || null,
                    category: "quotes",
                    user_id: uid,
                    is_public: false,
                    attribution_type: post.attribution_type || "found",
                    attribution_url: post.attribution_url || null,
                    title_font: post.title_font || null,
                    body_font: post.body_font || null,
                    title_color: post.title_color || null,
                    body_color: post.body_color || null,
                    author_name: post.author_name || "saved"
                };
                var { error } = await sb.from("posts").insert(payload);
                if (error) alert(error.message);
                else alert("сохранено на твою доску");
            });
        }

        return pin;
    }

    async function loadBoard() {
        var feed = document.getElementById("feed");
        feed.innerHTML = '<div class="empty">loading...</div>';
        await resolveViewedUser();

        var q = sb.from("posts").select("*").eq("category", "quotes");

        if (mode === "public") {
            q = q.eq("is_public", true).order("created_at", { ascending: false }).limit(120);
        } else {
            if (!viewedUserId) {
                feed.innerHTML = '<div class="empty">профиль не найден</div>';
                return;
            }
            q = q.eq("user_id", viewedUserId).order("created_at", { ascending: false });
        }

        var { data, error } = await q;

        if (error) {
            // fallback если нет колонки is_public
            if (String(error.message).indexOf("is_public") !== -1 && mode === "public") {
                var all = await sb.from("posts").select("*").eq("category", "quotes").order("created_at", { ascending: false }).limit(120);
                data = all.data || [];
                error = all.error;
            } else if (mode === "mine" && viewedUserId) {
                var mine = await sb.from("posts").select("*").eq("category", "quotes").order("created_at", { ascending: false });
                data = (mine.data || []).filter(function (p) {
                    return !p.user_id || String(p.user_id) === String(viewedUserId);
                });
                error = mine.error;
            }
        }

        if (error && !data) {
            feed.innerHTML = '<div class="empty">' + escapeHtml(error.message) + '</div>';
            return;
        }

        data = data || [];
        if (mode === "mine") data = applySavedOrder(data);

        if (!data.length) {
            feed.innerHTML = '<div class="empty">' +
                (mode === "public" ? "в общей ленте пока пусто" : "доска пустая — ★ добавить") +
                '</div>';
            return;
        }

        feed.innerHTML = "";
        data.forEach(function (post) { feed.appendChild(makePin(post)); });
    }

    // tabs
    document.getElementById("tab-mine").onclick = function () {
        mode = "mine";
        document.getElementById("tab-mine").classList.add("active");
        document.getElementById("tab-public").classList.remove("active");
        loadBoard();
    };
    document.getElementById("tab-public").onclick = function () {
        mode = "public";
        document.getElementById("tab-public").classList.add("active");
        document.getElementById("tab-mine").classList.remove("active");
        loadBoard();
    };

    // auth + compose
    var authOverlay = document.getElementById("auth-overlay");
    var composeOverlay = document.getElementById("compose-overlay");
    function openAuth() { authOverlay.classList.add("open"); document.getElementById("auth-error").textContent = ""; }
    function closeAuth() { authOverlay.classList.remove("open"); }
    function openCompose() { composeOverlay.classList.add("open"); document.getElementById("compose-error").textContent = ""; }
    window.__openQuoteCompose = openCompose;
    function closeCompose() { composeOverlay.classList.remove("open"); }

    /* star -> core */

    document.getElementById("auth-close").onclick = closeAuth;
    document.getElementById("compose-close").onclick = closeCompose;

    document.getElementById("auth-login").onclick = async function () {
        var err = document.getElementById("auth-error");
        err.textContent = "";
        var { error } = await sb.auth.signInWithPassword({
            email: document.getElementById("auth-email").value.trim(),
            password: document.getElementById("auth-password").value
        });
        if (error) { err.textContent = error.message; return; }
        closeAuth();
        openCompose();
        loadBoard();
    };

    document.getElementById("auth-signup").onclick = async function () {
        var err = document.getElementById("auth-error");
        err.textContent = "";
        var email = document.getElementById("auth-email").value.trim();
        var password = document.getElementById("auth-password").value;
        var { data, error } = await sb.auth.signUp({ email: email, password: password });
        if (error) { err.textContent = error.message; return; }
        err.textContent = "аккаунт создан — подтверди почту, потом войди";
        if (data && data.user) {
            await sb.from("profiles").upsert({
                id: data.user.id,
                display_name: email.split("@")[0].slice(0, 32) || "user",
                friend_code: "KQ-" + Math.random().toString(36).slice(2, 8).toUpperCase(),
                updated_at: new Date().toISOString()
            }, { onConflict: "id" });
        }
    };

    document.getElementById("compose-media").oninput = function () {
        var u = document.getElementById("compose-media").value.trim();
        var img = document.getElementById("compose-preview");
        if (u) { img.style.display = "block"; img.src = u; }
        else { img.style.display = "none"; img.src = ""; }
    };

    function selectedAttr() {
        var els = document.querySelectorAll('input[name="attr-type"]');
        for (var i = 0; i < els.length; i++) if (els[i].checked) return els[i].value;
        return "unknown";
    }

    document.getElementById("compose-save").onclick = async function () {
        var err = document.getElementById("compose-error");
        err.textContent = "";
        var uid = await currentUserId();
        if (!uid) { err.textContent = "нужен вход"; return; }

        var title = document.getElementById("compose-title").value.trim().slice(0, 80);
        var content = document.getElementById("compose-content").value.trim().slice(0, MAX_QUOTE);
        var media_url = document.getElementById("compose-media").value.trim();
        var attrType = selectedAttr();
        var attrUrl = document.getElementById("compose-attr-url").value.trim();

        if (!title && !content && !media_url) {
            err.textContent = "добавь текст или картинку";
            return;
        }
        if ((attrType === "author" || attrType === "found") && !attrUrl) {
            err.textContent = "для этого варианта нужна ссылка";
            return;
        }

        var { data: prof } = await sb.from("profiles").select("display_name").eq("id", uid).maybeSingle();

        var payload = {
            title: title,
            content: content,
            category: "quotes",
            user_id: uid,
            is_public: !!document.getElementById("compose-public").checked,
            attribution_type: attrType,
            attribution_url: attrUrl || null,
            title_font: document.getElementById("compose-title-font").value,
            body_font: document.getElementById("compose-body-font").value,
            title_color: document.getElementById("compose-title-color").value,
            body_color: document.getElementById("compose-body-color").value,
            author_name: (prof && prof.display_name) ? prof.display_name : null
        };
        if (media_url) {
            payload.media_url = media_url;
            payload.media_type = /\.gif(\?|$)/i.test(media_url) ? "gif" : "image";
        }

        var { error } = await sb.from("posts").insert(payload);
        if (error) {
            // если новых колонок нет — упрощённый insert
            if (/is_public|attribution|title_font|body_font|title_color|body_color|author_name/i.test(error.message)) {
                var basic = {
                    title: title,
                    content: content,
                    category: "quotes",
                    user_id: uid
                };
                if (media_url) {
                    basic.media_url = media_url;
                    basic.media_type = payload.media_type;
                }
                var retry = await sb.from("posts").insert(basic);
                if (retry.error) { err.textContent = retry.error.message; return; }
                err.textContent = "сохранено упрощённо — добавь колонки в posts (см. инструкцию)";
            } else {
                err.textContent = error.message;
                return;
            }
        }

        document.getElementById("compose-title").value = "";
        document.getElementById("compose-content").value = "";
        document.getElementById("compose-media").value = "";
        document.getElementById("compose-attr-url").value = "";
        document.getElementById("compose-public").checked = false;
        document.getElementById("compose-preview").style.display = "none";
        closeCompose();
        mode = "mine";
        document.getElementById("tab-mine").classList.add("active");
        document.getElementById("tab-public").classList.remove("active");
        loadBoard();
    };

    document.getElementById("post-menu-delete").onclick = async function () {
        if (!activePostMenu) return;
        if (!confirm("Удалить?")) return;
        var { error } = await sb.from("posts").delete().eq("id", activePostMenu.id);
        hidePostMenu();
        if (error) alert(error.message);
        else loadBoard();
    };

    document.getElementById("post-menu-edit").onclick = async function () {
        if (!activePostMenu) return;
        var post = activePostMenu;
        hidePostMenu();
        var title = prompt("Заголовок", post.title || "");
        if (title === null) return;
        var content = prompt("Текст", post.content || "");
        if (content === null) return;
        var { error } = await sb.from("posts").update({
            title: String(title).slice(0, 80),
            content: String(content).slice(0, MAX_QUOTE)
        }).eq("id", post.id);
        if (error) alert(error.message);
        else loadBoard();
    };

    document.addEventListener("click", function (e) {
        var menu = document.getElementById("post-menu");
        if (!menu.classList.contains("open")) return;
        if (e.target.closest("#post-menu") || e.target.closest(".pin-menu-btn")) return;
        hidePostMenu();
    });

    loadBoard();
})();
    </script>

<script>
(function () {
  if (!window.Kinqsy) return;
  Kinqsy.init({
    onLoginSuccess: async function () {
      if (typeof window.__openQuoteCompose === "function") window.__openQuoteCompose();
      else location.reload();
    },
    onStarLoggedIn: async function (uid) {
      if (typeof window.__openQuoteCompose === "function") window.__openQuoteCompose();
    }
  });
})();
</script>
